<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MLMariss · YouTube analytics</title>
<style>
  /* Palette: validated data-viz reference instance (light + dark, theme-aware).
     Dark values are declared under both the media query (OS setting) and the
     [data-theme] scope (manual toggle), so the toggle wins either way. */
  :root {
    color-scheme: light;
    --plane:      #f9f9f7;   /* page background */
    --surface:    #ffffff;   /* cards, table */
    --surface-2:  #f4f4f1;   /* insets, expanded rows, hover */
    --text:       #0b0b0b;
    --text-2:     #52514e;
    --muted:      #66655f;   /* 5.8:1 on white */
    --grid:       #e1e0d9;
    --line:       #e6e5df;
    --baseline:   #c3c2b7;
    --border:     rgba(11,11,11,0.10);
    --accent:     #2a78d6;   /* series-1 blue */
    --accent-100: #cde2fb;   /* sequential step 100 */
    --accent-ink: #ffffff;   /* text on accent */
    --good:       #0a7f0a;   /* status text: 5:1 or better on white */
    --warn:       #8f6708;
    --bad:        #c22f2f;
    --link:       #1d5fb0;
    --shadow:     0 1px 2px rgba(11,11,11,.04), 0 2px 8px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:     #0d0d0d;
      --surface:   #1a1a19;
      --surface-2: #232320;
      --text:      #ffffff;
      --text-2:    #c3c2b7;
      --muted:     #a9a8a0;
      --grid:      #2c2c2a;
      --line:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --accent:    #3987e5;
      --accent-100:#184f95;
      --accent-ink:#ffffff;
      --good:      #3fc43f;
      --warn:      #fab219;
      --bad:       #ec6a6a;
      --link:      #78b0f5;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:     #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #232320;
    --text:      #ffffff;
    --text-2:    #c3c2b7;
    --muted:     #a9a8a0;
    --grid:      #2c2c2a;
    --line:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --accent:    #3987e5;
    --accent-100:#184f95;
    --accent-ink:#ffffff;
    --good:      #3fc43f;
    --warn:      #fab219;
    --bad:       #ec6a6a;
    --link:      #78b0f5;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--plane); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .stamp { color: var(--muted); font-size: 13.5px; }
  .spacer { flex: 1 1 auto; }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 13.5px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); }

  /* Full-width fluid layout: content fills the viewport, no left-pinned cap. */
  .wrap { padding: 22px 28px 90px; width: 100%; max-width: 1760px; margin: 0 auto; }

  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .metric .label {
    color: var(--muted); font-size: 12.5px; text-transform: uppercase;
    letter-spacing: .05em; display: flex; align-items: center; gap: 5px;
  }
  .metric .value {
    font-size: 26px; font-weight: 650; margin-top: 4px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .metric .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

  .info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--muted); color: var(--muted);
    font-size: 9px; font-weight: 700; cursor: help; flex: none;
    font-style: normal; line-height: 1;
  }
  .info:hover { color: var(--text); border-color: var(--text); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card-pad { padding: 14px 16px; }

  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .toolbar .grp { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { color: var(--muted); font-size: 13.5px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }

  button, select, input {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--baseline); }
  .seg button { border-radius: 0; border-left-width: 0; }
  .seg button:first-child { border-radius: 7px 0 0 7px; border-left-width: 1px; }
  .seg button:last-child { border-radius: 0 7px 7px 0; }
  button.active {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600;
  }
  input[type=search], input[type=date], input[type=number] { cursor: text; }
  input[type=search] { min-width: 190px; }
  input[type=date] { min-width: 140px; }
  input[type=number] { width: 110px; }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .chip {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; font-size: 13.5px; color: var(--text-2);
  }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td {
    text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child {
    text-align: left; white-space: normal; min-width: 260px; font-variant-numeric: normal;
  }
  thead th {
    color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
    position: sticky; top: var(--header-h, 62px); background: var(--surface); z-index: 5;
  }
  thead th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th .arrow { font-size: 9px; opacity: .8; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--surface-2); }
  tbody tr.row.open { background: var(--surface-2); }
  .title-cell { display: flex; gap: 11px; align-items: center; }
  .title-cell img { width: 68px; height: 38px; object-fit: cover; border-radius: 5px; flex: none; }
  .title-cell .t { font-weight: 550; }
  .title-cell .sub { color: var(--muted); font-size: 12.5px; }
  .caret { color: var(--muted); font-size: 10px; margin-right: 5px; display: inline-block; width: 8px; }
  td.detail { text-align: left; white-space: normal; background: var(--surface-2); padding: 0; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 16px; }
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .panel-box h3 {
    margin: 0 0 8px; font-size: 12.5px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .panel-box table { font-size: 13.5px; }
  .panel-box th, .panel-box td { padding: 5px 7px; border-bottom: 1px solid var(--line); }
  .panel-box th:first-child, .panel-box td:first-child { min-width: 0; }
  .panel-box thead th { position: static; }
  /* Fixed column widths so stacked breakdown tables (Device above OS, and the
     panels next to each other) line their Views/Share columns up exactly. */
  .panel-box table.mini { table-layout: fixed; }
  .panel-box table.mini col.c-val   { width: 64px; }
  .panel-box table.mini col.c-share { width: 54px; }
  .panel-box table.mini col.c-src   { width: 38%; }
  .panel-box table.mini td, .panel-box table.mini th { overflow: hidden; text-overflow: ellipsis; }
  .panel-box table.mini + table.mini { margin-top: 10px; }
  .panel-box td.grp {
    vertical-align: top; color: var(--text-2); font-weight: 550;
    border-right: 1px solid var(--line); white-space: normal;
  }
  .panel-box .muted { color: var(--muted); }

  .empty { color: var(--muted); font-size: 13.5px; font-style: italic; }
  .bar { height: 4px; background: var(--accent); border-radius: 999px; display: block; margin-top: 4px; opacity: .55; }
  .bar.wt { background: var(--accent); opacity: .35; }

  .notice {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--warn); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px; font-size: 14.5px; box-shadow: var(--shadow);
  }
  .notice.error { border-left-color: var(--bad); }
  .notice code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .hidden { display: none; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  /* Chart */
  .spark-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .spark-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
  .spark-peak { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  svg.spark { display: block; width: 100%; height: 120px; overflow: visible; }
  .sp-tip {
    position: absolute; pointer-events: none; background: var(--text); color: var(--surface);
    padding: 4px 8px; border-radius: 6px; font-size: 12.5px; white-space: nowrap;
    transform: translate(-50%, -130%); opacity: 0; transition: opacity .08s; font-variant-numeric: tabular-nums;
  }

  /* Sections: every part of the page folds away; the choice is remembered. */
  details.section { margin-bottom: 22px; }
  details.section > summary, details.group > summary {
    list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  details.section > summary::-webkit-details-marker,
  details.group > summary::-webkit-details-marker { display: none; }
  details.section > summary { padding: 4px 2px 12px; }
  details.section > summary h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  details.section > summary .stamp { font-size: 14.5px; }
  .fold {
    color: var(--muted); font-size: 13px; width: 14px; display: inline-block;
    transition: transform .15s; transform-origin: 40% 50%;
  }
  details[open] > summary .fold { transform: rotate(90deg); }

  /* Needs attention */
  .att-health { display: grid; gap: 8px; margin-bottom: 14px; }
  .att-h {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--muted);
    border-radius: 10px; padding: 11px 14px; font-size: 15px; color: var(--text-2);
  }
  .att-h.warn { border-left-color: var(--warn); }
  .att-h.error { border-left-color: var(--bad); }
  details.group {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  details.group > summary { padding: 15px 18px; }
  details.group > summary h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .count {
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 10px;
    font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; align-self: center;
  }
  .group-what { color: var(--text-2); font-size: 15px; flex-basis: 100%; padding-left: 26px; margin-top: -4px; }
  .group-body { padding: 0 18px 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; }

  .vcard {
    border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--plane);
    display: flex; flex-direction: column; gap: 13px; min-width: 0;
  }
  .vc-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
  .tag {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 6px; padding: 1px 8px; font-size: 13.5px; font-weight: 600;
  }
  .tag.how { border-color: var(--accent); color: var(--link); background: transparent; }
  .att-new {
    display: inline-block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
    color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 2px 7px;
  }
  .vc-title { margin: 0; font-size: 17.5px; font-weight: 650; line-height: 1.35; }
  .vc-title a { color: var(--text); text-decoration: none; }
  .vc-title a:hover { text-decoration: underline; }
  .vc-stats { display: grid; gap: 8px; }
  .stat { display: grid; grid-template-columns: 108px minmax(0, 1fr) 150px; gap: 4px 14px; align-items: center; }
  .st-k { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
  .st-v { font-size: 17px; font-variant-numeric: tabular-nums; }
  .st-v b { font-weight: 700; }
  .st-d { font-size: 14.5px; font-weight: 700; margin-left: 8px; white-space: nowrap; }
  .st-d.flat { color: var(--muted); font-weight: 500; }
  .vc-why { font-size: 15px; color: var(--text-2); line-height: 1.5; }
  .vc-why b, .vc-why strong { color: var(--text); }
  .vc-why a, .early a, .mtable a, .att-table a { color: var(--link); }
  .inl {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    font-weight: 700; margin-right: 7px;
  }
  ol.vc-plan { margin: 0; padding-left: 22px; display: grid; gap: 9px; font-size: 15.5px; line-height: 1.45; }
  ol.vc-plan li::marker { color: var(--muted); font-weight: 700; }
  .learned { display: block; font-size: 14px; color: var(--text-2); margin-top: 2px; }
  a.did { font-size: 14px; font-weight: 600; margin-left: 6px; white-space: nowrap; color: var(--link); }
  .vc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: none; cursor: pointer; line-height: 1.2;
  }
  .btn:hover { border-color: var(--baseline); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 5px 10px; font-size: 13.5px; }
  .vc-history { font-size: 14px; color: var(--text-2); border-top: 1px dashed var(--line); padding-top: 10px; }
  .chip-result { font-weight: 700; white-space: nowrap; }
  .chip-result.flat { color: var(--muted); font-weight: 600; }

  details.members > summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--link); padding: 2px 0; }
  .mtable, .att-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 8px; }
  .mtable th, .mtable td, .att-table th, .att-table td {
    padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap;
  }
  .mtable th:first-child, .mtable td:first-child, .att-table th:first-child, .att-table td:first-child {
    text-align: left; white-space: normal; min-width: 0;
  }
  .mtable thead th, .att-table thead th {
    position: static; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    background: transparent; cursor: default;
  }
  .scroll-x { overflow-x: auto; }

  .early-row {
    display: flex; gap: 10px 18px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 13px 0; border-top: 1px solid var(--line); font-size: 15.5px;
  }
  .early-row:first-child { border-top: 0; }
  .early-row .vc-actions { flex: none; }
  .early h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .early h4:first-child { margin-top: 0; }
  .topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
  .topics .box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; background: var(--plane); }
  .topics h4 { margin: 0 0 4px; font-size: 15px; }
  .quiet { color: var(--text-2); font-size: 15px; margin: 4px 2px 0; }
  .empty-state { color: var(--text-2); font-size: 15px; line-height: 1.5; margin: 0 0 12px; }
  /* Trend: 28 days, last week shaded, this week in the accent over the muted past. */
  svg.spark-mini { width: 150px; height: 34px; display: block; overflow: visible; cursor: crosshair; }
  .sm-band { fill: var(--surface-2); }
  .sm-base { stroke: var(--baseline); stroke-width: 1; }
  .sm-old { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .sm-new { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
  .sm-dot { fill: var(--accent); stroke: var(--plane); stroke-width: 1.5; }
  .sm-hover { fill: var(--text); stroke: var(--plane); stroke-width: 1.5; opacity: 0; }
  .att-tip {
    position: fixed; pointer-events: none; background: var(--text); color: var(--surface);
    padding: 5px 9px; border-radius: 6px; font-size: 13px; white-space: nowrap;
    transform: translate(-50%, -135%); opacity: 0; transition: opacity .08s;
    font-variant-numeric: tabular-nums; z-index: 30;
  }
  @media (max-width: 720px) {
    .stat { grid-template-columns: 96px minmax(0, 1fr); }
    .stat svg.spark-mini { grid-column: 1 / -1; width: 100%; }
    .group-what { padding-left: 0; }
    .wrap { padding: 16px 16px 60px; }
  }

  /* Glossary */
  details.glossary { margin-bottom: 16px; }
  details.glossary > summary {
    cursor: pointer; color: var(--text-2); font-size: 14.5px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    list-style: none; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
  }
  details.glossary > summary::-webkit-details-marker { display: none; }
  details.glossary[open] > summary { border-radius: 10px 10px 0 0; }
  .gloss-body {
    background: var(--surface); border: 1px solid var(--border); border-top: 0;
    border-radius: 0 0 10px 10px; padding: 4px 16px 14px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px 24px;
  }
  .gloss-body dt { font-weight: 650; margin-top: 12px; font-size: 14.5px; }
  .gloss-body dd { margin: 2px 0 0; color: var(--text-2); font-size: 14px; }
  .gloss-body .src { color: var(--muted); font-size: 12.5px; }
  .gloss-body a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>MLMariss · YouTube analytics</h1>
    <span class="stamp" id="stamp">loading…</span>
  </div>
  <span class="spacer"></span>
  <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark">
    <span id="theme-icon">◐</span><span id="theme-label">Theme</span>
  </button>
</header>

<div class="wrap">

  <div id="notice" class="notice hidden"></div>

  <details class="section" data-key="attention" open>
    <summary><span class="fold">▶</span><h2>Needs attention</h2><span class="stamp" id="att-range"></span></summary>
    <div id="attention"></div>
  </details>
  <div class="att-tip" id="att-tip"></div>

  <details class="section" data-key="channel" open>
  <summary><span class="fold">▶</span><h2>Channel and all videos</h2>
    <span class="stamp">totals, traffic sources and every video, for the time window you pick</span></summary>

  <div class="metrics" id="metrics"></div>

  <details class="glossary" id="glossary">
    <summary><span class="info">i</span> What do these metrics mean?</summary>
    <dl class="gloss-body" id="gloss-body"></dl>
  </details>

  <div class="card">
    <div class="toolbar">
      <div class="grp seg" role="group" aria-label="Time window">
        <button data-window="7d">7 days</button>
        <button data-window="28d">28 days</button>
        <button data-window="90d" class="active">90 days</button>
        <button data-window="365d">365 days</button>
        <button data-window="all">All time</button>
      </div>
      <span class="spacer"></span>
      <div class="grp">
        <input type="search" id="f-text" placeholder="Filter titles…" />
        <span class="sep"></span>
        <span class="lbl">Published</span>
        <div class="grp seg" role="group" aria-label="Publish-date preset">
          <button type="button" data-pub="all" class="active">Any</button>
          <button type="button" data-pub="7">7d</button>
          <button type="button" data-pub="28">28d</button>
          <button type="button" data-pub="90">90d</button>
          <button type="button" data-pub="365">1y</button>
        </div>
        <input type="date" id="f-from" title="Published on or after" />
        <span class="lbl">→</span>
        <input type="date" id="f-to" title="Published on or before" />
        <span class="sep"></span>
        <span class="lbl">Format</span>
        <select id="f-format">
          <option value="all">All</option>
          <option value="short">Shorts (≤60s)</option>
          <option value="long">Long-form</option>
        </select>
        <span class="sep"></span>
        <span class="lbl">Source</span>
        <select id="f-source"><option value="all">Any</option></select>
        <span class="sep"></span>
        <span class="lbl">Min views</span>
        <input type="number" id="f-minviews" min="0" step="10" placeholder="0" />
        <button id="f-reset">Reset</button>
        <span class="chip" id="f-count"></span>
      </div>
    </div>

    <div class="card-pad" id="spark-wrap" style="position:relative">
      <div class="spark-head">
        <span class="spark-title">Impressions per day</span>
        <span class="spark-peak" id="spark-peak"></span>
      </div>
      <svg id="spark" class="spark hidden"></svg>
      <div class="sp-tip" id="sp-tip"></div>
    </div>
  </div>

  <div id="channel-traffic"></div>

  <div class="card">
    <table id="tbl">
      <thead>
        <tr id="head-row"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  </details>

</div>

<script>
// This dashboard is read-only. There is no OAuth, no API key and no login:
// the GitHub Actions collector writes data/*.json and this page just reads it.
let SUMMARY = null, DAILY = null, TRAFFIC = null, TDETAIL = null,
    DEVICES = null, DEMOGRAPHICS = null;
// Default sort: newest uploads first, so the table opens on your latest videos.
let currentWindow = '90d', sortKey = 'publishedTs', sortDir = -1;
let expanded = null;
const F = { text: '', from: '', to: '', format: 'all', source: 'all', minViews: 0 };

// ---- Traffic source labels -------------------------------------------------
// The Reporting API encodes traffic_source_type as an integer code. This maps
// the codes YouTube documents to readable names; unknown codes fall back to
// "Source N" so nothing is ever a bare number.
// Refs: developers.google.com/youtube/reporting/v1/reports/dimensions
const SOURCE_LABELS = {
  '0': 'Direct or unknown',
  '1': 'YouTube advertising',
  '3': 'Browse features',
  '4': 'Channel pages',
  '5': 'YouTube search',
  '7': 'Suggested videos',
  '8': 'Other YouTube features',
  '9': 'External',
  '11': 'Cards',
  '14': 'Playlists',
  '17': 'Notifications',
  '18': 'Playlist page',
  '19': 'Claimed content',
  '20': 'End screens',
  '24': 'Shorts feed',
  '25': 'Product pages',
  '26': 'Hashtag pages',
  '27': 'Video remixes',
  '28': 'Live redirects',
  'UNKNOWN': 'Unknown',
};
const sourceLabel = code => {
  const k = String(code);
  return SOURCE_LABELS[k] || (/^\d+$/.test(k) ? `Source ${k}` : k);
};

// ---- Device / OS / demographic decoding ------------------------------------
// device_type and operating_system come from the Reporting API as integer
// codes. Google no longer publishes the integer->name table (the docs show
// string names now), so these were recovered from this channel's own data by
// cross-referencing which OS runs on which device: the single biggest OS (2)
// is desktop-only -> Windows, so its device (101) is Computer; OS 4 shows up on
// phones, tablets and TVs but never desktop -> Android; the TV device carries
// Chromecast (21). Codes we can't confirm (the long tail of smart-TV and
// game-console OSes, all tiny) fall back to "OS N"/"Device N" so a raw number
// is never shown on its own.
const DEVICE_LABELS = {
  '100': 'Unknown', '101': 'Computer', '102': 'TV',
  '103': 'Game console', '104': 'Mobile phone', '105': 'Tablet',
};
const OS_LABELS = {
  '1': 'Other', '2': 'Windows', '4': 'Android',
  '5': 'iOS', '9': 'macOS', '21': 'Chromecast',
};
const deviceLabel = c => DEVICE_LABELS[String(c)] || `Device ${esc(c)}`;
const osLabel = c => OS_LABELS[String(c)] || `OS ${esc(c)}`;

const AGE_LABELS = {
  'AGE_13_17': '13–17', 'AGE_18_24': '18–24', 'AGE_25_34': '25–34',
  'AGE_35_44': '35–44', 'AGE_45_54': '45–54', 'AGE_55_64': '55–64',
  'AGE_65_': '65+',
};
const GENDER_LABELS = {
  'MALE': 'Male', 'FEMALE': 'Female',
  'USER_SPECIFIED': 'User-specified', 'GENDER_OTHER': 'Other', 'UNKNOWN': 'Unknown',
};
// "AGE_25_34/MALE" -> "25–34 · Male".
function demoLabel(key) {
  const [age, gender] = String(key).split('/');
  const a = AGE_LABELS[age] || esc(age);
  const g = GENDER_LABELS[gender] || (gender ? esc(gender) : '');
  return g ? `${a} · ${g}` : a;
}

// Browse-feature detail slugs are cryptic; name the common ones. Everything
// else is shown exactly as YouTube returned it (a search term, a domain, …).
const BROWSE_DETAIL = {
  'what-to-watch': 'Home / What to watch',
  '/my_subscriptions': 'Subscriptions feed',
  'my-history': 'Watch history',
  'watch-later': 'Watch later',
  'uploaded_other': 'Your channel uploads',
};
const VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;
const CHANNEL_ID_RE = /^UC[A-Za-z0-9_-]{22}$/;
const PLAYLIST_ID_RE = /^(PL|UU|LL|FL|OL)[A-Za-z0-9_-]{10,}$/;
// A referrer detail is often an opaque video/channel ID, which is exactly the
// "numbers mean nothing" problem — so link IDs out to the actual video/channel.
function detailCell(detail) {
  const d = String(detail);
  if (BROWSE_DETAIL[d]) return esc(BROWSE_DETAIL[d]);
  if (d === 'unknown' || d === 'NULL') return '<span class="muted">unknown</span>';
  if (VIDEO_ID_RE.test(d)) {
    // Prefer the video's title when it is one of our own uploads; external
    // videos aren't in video_meta, so those keep the raw ID as the link text.
    const meta = (SUMMARY && SUMMARY.video_meta) || {};
    const title = meta[d] && meta[d].title;
    return `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(d)}" target="_blank" rel="noopener">${title ? esc(title) : esc(d)}</a>`;
  }
  if (PLAYLIST_ID_RE.test(d))
    return `<a href="https://www.youtube.com/playlist?list=${encodeURIComponent(d)}" target="_blank" rel="noopener">a playlist</a>`;
  if (CHANNEL_ID_RE.test(d))
    return `<a href="https://www.youtube.com/channel/${encodeURIComponent(d)}" target="_blank" rel="noopener">${esc(d)}</a>`;
  return esc(d);
}

// ---- Metric definitions (YouTube documentation) ----------------------------
const METRICS = {
  impressions: ['Impressions',
    'How many times your thumbnails were shown to viewers on YouTube. Counts only YouTube surfaces (not external sites), when at least 50% of the thumbnail was on screen for more than one second.'],
  ctr: ['Click-through rate (CTR)',
    'The share of thumbnail impressions that turned into views — clicks ÷ impressions. Computed here as total clicks over total impressions across the window, never an average of daily rates.'],
  views: ['Views', 'The number of legitimate views of your videos in the window.'],
  avg_view_percentage: ['Retention (average % viewed)',
    'The average percentage of the video that viewers watched. Can exceed 100% when parts are re-watched or looped.'],
  watch_time_minutes: ['Watch time',
    "Total minutes viewers spent watching. YouTube's primary discovery signal — it favours total watch time, not just views."],
  wt_share: ['Watch-time share',
    'This video’s share of the total watch time across the videos currently in view (after filters). Shows which uploads carry the channel. Custom metric, not from YouTube.'],
  subscribers_gained: ['Subscribers gained',
    'Subscribers gained that YouTube attributes to the video during the window (before subtracting any lost).'],
  engagement: ['Engagement rate',
    '(likes + comments + shares) ÷ views, as a percentage. A custom interaction rate — not an official YouTube metric.'],
  avg_view_seconds: ['Average view duration',
    'The average length of a single playback (time watched ÷ views).'],
};

const COLS = [
  { key: 'title',              label: 'Video',      m: null },
  { key: 'publishedTs',        label: 'Published',  m: null },
  { key: 'impressions',        label: 'Impressions', m: 'impressions' },
  { key: 'ctr',                label: 'CTR',        m: 'ctr' },
  { key: 'views',              label: 'Views',      m: 'views' },
  { key: 'avg_view_percentage',label: 'Retention',  m: 'avg_view_percentage' },
  { key: 'watch_time_minutes', label: 'Watch time', m: 'watch_time_minutes' },
  { key: 'wt_share',           label: 'WT share',   m: 'wt_share' },
  { key: 'subscribers_gained', label: 'Subs',       m: 'subscribers_gained' },
  { key: 'engagement',         label: 'Engagement', m: 'engagement' },
];
const COLSPAN = COLS.length;

// Titles come from YouTube and search terms in traffic_detail.json are typed by
// viewers, so everything interpolated into innerHTML must be escaped properly.
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                               '"': '&quot;', "'": '&#39;' }[c]));

const fmt = n => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  n = Number(n);
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.round(n).toLocaleString();
};
const pct = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1) + '%';
const mins = m => {
  if (!m) return '—';
  const h = Math.floor(m/60), r = Math.round(m%60);
  return h > 0 ? `${h}h ${r}m` : `${r}m`;
};
// h:mm:ss past an hour, m:ss below it. Plenty of these videos run over two
// hours, so a bare m:ss would read as "128:03".
const secs = s => {
  if (s === null || s === undefined || isNaN(s)) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = Math.round(s%60);
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
};

// "PT2H8M3S" -> 7683. Used for the Shorts/long-form split and the duration label.
function durationSeconds(iso) {
  if (!iso) return null;
  const m = /^P(?:\d+D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso);
  if (!m) return null;
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}

// The breakdown files (traffic / devices / demographics / detail) are keyed by
// the same window names as summary.json, so every breakdown follows the active
// time-window button instead of a fixed 90-day view.
const WINDOW_LABELS = {
  '7d': 'last 7 days', '28d': 'last 28 days', '90d': 'last 90 days',
  '365d': 'last 365 days', 'all': 'all time',
};
function bucketLabel() {
  return WINDOW_LABELS[currentWindow] || currentWindow;
}
function slice(file, id) {
  if (!file) return null;
  const b = file[currentWindow];
  if (!b) return null;
  return id ? (b.videos || {})[id] : (b.channel || null);
}

function notice(html, isError) {
  const el = document.getElementById('notice');
  el.innerHTML = html;
  el.classList.toggle('error', !!isError);
  el.classList.remove('hidden');
}

async function loadJson(path) {
  const r = await fetch(path + '?t=' + Date.now());
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}
// Breakdown files are optional: they do not exist until their reports land.
async function loadOptional(path) {
  try { return await loadJson(path); } catch (e) { return null; }
}

// ---- Theme -----------------------------------------------------------------
function applyTheme(mode) {
  // mode: 'light' | 'dark' | null(=follow system)
  const root = document.documentElement;
  if (mode) root.setAttribute('data-theme', mode);
  else root.removeAttribute('data-theme');
  const dark = mode ? mode === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('theme-icon').textContent = dark ? '☾' : '☀';
  document.getElementById('theme-label').textContent = dark ? 'Dark' : 'Light';
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  applyTheme(saved === 'light' || saved === 'dark' ? saved : null);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = (cur ? cur === 'dark' : sysDark) ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
    renderSpark(); // re-stroke with the new surface colors
  });
}

function buildGlossary() {
  const order = ['impressions','ctr','views','avg_view_percentage','watch_time_minutes',
                 'wt_share','subscribers_gained','engagement','avg_view_seconds'];
  document.getElementById('gloss-body').innerHTML = order.map(k => {
    const [name, desc] = METRICS[k];
    return `<div><dt>${esc(name)}</dt><dd>${esc(desc)}</dd></div>`;
  }).join('') +
    `<div style="grid-column:1/-1;margin-top:12px" class="src">Definitions follow YouTube's ` +
    `<a href="https://support.google.com/youtube/answer/9002587" target="_blank" rel="noopener">Analytics help</a> and the ` +
    `<a href="https://developers.google.com/youtube/reporting/v1/reports/metrics" target="_blank" rel="noopener">Reporting API metrics</a> reference.</div>`;
}

function buildHead() {
  document.getElementById('head-row').innerHTML = COLS.map(c => {
    const t = c.m ? ` title="${esc(METRICS[c.m][0])}: ${esc(METRICS[c.m][1])}"` : '';
    return `<th data-sort="${c.key}"${t}>${esc(c.label)}</th>`;
  }).join('');
  document.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = k === 'title' ? 1 : -1; }
      render();
    });
  });
}

async function init() {
  initTheme();
  buildGlossary();
  buildHead();
  try {
    SUMMARY = await loadJson('data/summary.json');
  } catch (e) {
    document.getElementById('stamp').textContent = 'no data yet';
    notice(
      '<strong>No collected data yet.</strong><br>' +
      'The collector has not produced <code>data/summary.json</code>. If you have just set this up: ' +
      'add the three repository secrets, run the workflow once with <code>create_jobs</code> ticked, ' +
      'then wait up to 48 hours for YouTube to generate the first reports. ' +
      'Roughly 30 days of history are backfilled automatically.<br><br>' +
      '<span style="color:var(--muted)">' + esc(e.message) + '</span>', true);
    return;
  }
  [DAILY, TRAFFIC, TDETAIL, DEVICES, DEMOGRAPHICS, ATTENTION] = await Promise.all([
    loadOptional('data/daily.json'),
    loadOptional('data/traffic.json'),
    loadOptional('data/traffic_detail.json'),
    loadOptional('data/devices.json'),
    loadOptional('data/demographics.json'),
    loadOptional('data/attention.json'),
  ]);

  const when = SUMMARY.generated_at ? new Date(SUMMARY.generated_at) : null;
  // YouTube publishes each day two to three days late, so the newest day with
  // data matters more than when the collector last ran.
  const through = SUMMARY.data_through
    ? new Date(SUMMARY.data_through + 'T00:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC' })
    : null;
  document.getElementById('stamp').textContent = [
    through ? 'data through ' + through : '',
    when ? 'updated ' + when.toLocaleString() : '',
  ].filter(Boolean).join(' · ');

  const saved = openState();
  document.querySelectorAll('details.section[data-key]').forEach(d => {
    if (saved[d.dataset.key] !== undefined) d.open = saved[d.dataset.key];
  });
  renderAttention();
  populateSources();
  renderMetrics();
  renderSpark();
  renderChannelTraffic();
  render();
}

function populateSources() {
  const ch = slice(TRAFFIC, null) || {};
  const codes = Object.keys(ch);
  const sel = document.getElementById('f-source');
  const keep = sel.value;
  // Sort options by readable label for a friendlier dropdown.
  codes.sort((a, b) => sourceLabel(a).localeCompare(sourceLabel(b)));
  sel.innerHTML = '<option value="all">Any</option>' +
    codes.map(c => `<option value="${esc(c)}">${esc(sourceLabel(c))}</option>`).join('');
  if (codes.includes(keep)) sel.value = keep;
  else { sel.value = 'all'; F.source = 'all'; }
  sel.disabled = codes.length === 0;
}

function allRows() {
  const w = (SUMMARY.windows || {})[currentWindow] || {};
  const meta = SUMMARY.video_meta || {};
  return Object.keys(w).map(id => {
    const d = w[id], m = meta[id] || {};
    const eng = d.views ? ((d.likes + d.comments + d.shares) / d.views) * 100 : null;
    const dur = durationSeconds(m.duration);
    return Object.assign({
      id, title: m.title || id, thumb: m.thumbnail,
      published: m.published_at || null,
      publishedTs: m.published_at ? Date.parse(m.published_at) : null,
      durationSec: dur, engagement: eng,
    }, d);
  });
}

function currentRows() {
  let rows = allRows();

  if (F.text) {
    const f = F.text.toLowerCase();
    rows = rows.filter(r => (r.title || '').toLowerCase().includes(f));
  }
  if (F.from) {
    const t = Date.parse(F.from + 'T00:00:00Z');
    rows = rows.filter(r => r.publishedTs !== null && r.publishedTs >= t);
  }
  if (F.to) {
    // Inclusive of the chosen day.
    const t = Date.parse(F.to + 'T23:59:59Z');
    rows = rows.filter(r => r.publishedTs !== null && r.publishedTs <= t);
  }
  if (F.format !== 'all') {
    rows = rows.filter(r => {
      if (r.durationSec === null) return false;
      return F.format === 'short' ? r.durationSec <= 60 : r.durationSec > 60;
    });
  }
  if (F.source !== 'all') {
    rows = rows.filter(r => {
      const t = slice(TRAFFIC, r.id);
      return t && t[F.source] && t[F.source].views > 0;
    });
  }
  if (F.minViews > 0) {
    rows = rows.filter(r => (r.views || 0) >= F.minViews);
  }

  // Watch-time share is relative to the visible set, so compute it after
  // filtering and before sorting (so the column is sortable too).
  const totalWt = rows.reduce((s, r) => s + (r.watch_time_minutes || 0), 0);
  rows.forEach(r => {
    r.wt_share = totalWt ? ((r.watch_time_minutes || 0) / totalWt) * 100 : null;
  });

  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'title') return sortDir * String(x).localeCompare(String(y));
    x = (x === null || x === undefined) ? -Infinity : x;
    y = (y === null || y === undefined) ? -Infinity : y;
    return sortDir * (x - y);
  });
  return rows;
}

function renderMetrics() {
  // Metric cards summarise the filtered selection, so they move with the filters.
  const vals = currentRows();
  const imps = vals.reduce((s, v) => s + (v.impressions || 0), 0);
  const views = vals.reduce((s, v) => s + (v.views || 0), 0);
  const wt = vals.reduce((s, v) => s + (v.watch_time_minutes || 0), 0);
  const subs = vals.reduce((s, v) => s + (v.subscribers_gained || 0), 0);
  // Channel CTR must be total clicks over total impressions, never a mean of
  // per-video CTRs, which would weight a 50-impression video like a 50k one.
  const clicks = vals.reduce((s, v) =>
    s + ((v.impressions || 0) * ((v.ctr || 0) / 100)), 0);
  const ctr = imps ? (clicks / imps) * 100 : null;
  const ch = SUMMARY.channel || {};

  const info = k => `<span class="info" title="${esc(METRICS[k][0])}: ${esc(METRICS[k][1])}">i</span>`;
  const cards = [
    ['Subscribers', fmt(ch.subscriber_count), '', null],
    ['Impressions', fmt(imps), '', 'impressions'],
    ['CTR', pct(ctr), 'clicks ÷ impressions', 'ctr'],
    ['Views', fmt(views), '', 'views'],
    ['Watch time', mins(wt), '', 'watch_time_minutes'],
    ['Subs gained', fmt(subs), '', 'subscribers_gained'],
    ['Videos', fmt(vals.length), 'in current filter', null],
  ];
  document.getElementById('metrics').innerHTML = cards.map(
    ([l, v, sub, m]) => `<div class="metric">
      <div class="label">${esc(l)}${m ? info(m) : ''}</div>
      <div class="value">${v}</div>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
    </div>`
  ).join('');
}

// ---- Needs attention -------------------------------------------------------
// monitor.py compares every video with itself (this week against last week,
// and the week before for slower climbs) and sorts what changed by what to do
// about it. actions.py measures what was done, and what worked before is shown
// next to each suggestion.
let ATTENTION = null;
const CARDS_SHOWN = 6;          // cards per group before "Show all"
const showAll = new Set();      // groups showing every card

// Logging an action opens this repository's "Log an action" issue form.
const REPO = (() => {
  const h = location.hostname;
  if (h.endsWith('.github.io')) return `${h.split('.')[0]}/${location.pathname.split('/').filter(Boolean)[0] || ''}`;
  return 'MLMariss/youtube-analyzer';
})();
// Mirrors actions.KINDS: these labels are what the issue form expects.
const KIND_LABEL = {
  thumbnail: 'Thumbnail / Test & Compare', title: 'Title', description: 'Description', tags: 'Tags',
  pinned_comment: 'Pinned comment', end_screen: 'End screen / cards', playlist: 'Playlist',
  follow_up: 'Follow-up video or Short', community_post: 'Community post',
  reply_comments: 'Replied to comments', external: 'Outside promotion', other: 'Other',
};
const SITUATION_LABEL = {
  packaging: 'reach up, clicks down', clicks: 'clicks dropping', wave: 'rising',
  losing: 'losing reach', conversation: 'conversation', '*': 'any situation',
};
const HOW_LABEL = { jump: 'jumped this week', drop: 'dropped this week',
                    climb: 'climbing two weeks', slide: 'sliding two weeks' };

const studio = (id, page) => `https://studio.youtube.com/video/${encodeURIComponent(id)}/` +
  ({ edit: 'edit', comments: 'comments', analytics: 'analytics/tab-reach_viewers/period-default' }[page] || 'edit');
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const shortDate = d => new Date(d + 'T00:00:00Z')
  .toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const signedPct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(Math.abs(n) < 10 ? 1 : 0) + '%';
const ageLabel = d => d >= 365 ? `${(d / 365).toFixed(1)} years old` : `${d} days old`;
const attTitle = id => ((ATTENTION.videos || {})[id] || {}).title
  || (((SUMMARY && SUMMARY.video_meta) || {})[id] || {}).title || id;

function logUrl(id, situation, key) {
  const label = key ? KIND_LABEL[key] : '';
  const p = new URLSearchParams({
    template: 'log-action.yml',
    title: `Action: ${label || '…'} — ${attTitle(id)}`,
    video: `https://studio.youtube.com/video/${id}/edit`,
    situation: situation || '',
  });
  if (label) p.set('action', label);
  return `https://github.com/${REPO}/issues/new?${p}`;
}

// ---- Trend lines -------------------------------------------------------------
function sparkGeom(vals) {
  const W = 150, H = 34, pad = 3, n = vals.length, max = Math.max(...vals, 1);
  return { W, H, pad, n, x: i => pad + i * (W - 2 * pad) / (n - 1), y: v => H - pad - ((v || 0) / max) * (H - 2 * pad) };
}
function seriesFor(ref) {
  const [kind, key, metric] = ref.split('|');
  const s = kind === 'g' ? (ATTENTION.game_series || {})[key] : (ATTENTION.series || {})[key];
  return s && s[metric] ? { from: s.from, vals: s[metric], metric } : null;
}
function spark(ref) {
  const s = seriesFor(ref);
  if (!s || s.vals.length < 15) return '<span></span>';
  const g = sparkGeom(s.vals);
  const pts = s.vals.map((v, i) => `${g.x(i).toFixed(1)},${g.y(v).toFixed(1)}`);
  const n = g.n, lastStart = n - 14, thisStart = n - 7;
  return `<svg class="spark-mini" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="none" data-ref="${esc(ref)}"
      role="img" aria-label="${s.metric} per day, last ${n} days; last week shaded, this week highlighted">
    <rect class="sm-band" x="${g.x(lastStart).toFixed(1)}" y="0" width="${(g.x(thisStart - 1) - g.x(lastStart)).toFixed(1)}" height="${g.H}"/>
    <line class="sm-base" x1="${g.pad}" y1="${g.H - g.pad}" x2="${g.W - g.pad}" y2="${g.H - g.pad}" vector-effect="non-scaling-stroke"/>
    <polyline class="sm-old" points="${pts.slice(0, thisStart).join(' ')}" vector-effect="non-scaling-stroke"/>
    <polyline class="sm-new" points="${pts.slice(thisStart - 1).join(' ')}" vector-effect="non-scaling-stroke"/>
    <circle class="sm-dot" r="3" cx="${g.x(n - 1).toFixed(1)}" cy="${g.y(s.vals[n - 1]).toFixed(1)}"/>
    <circle class="sm-hover" r="3.5"/>
  </svg>`;
}
function miniSparkHover(evt) {
  const tip = document.getElementById('att-tip');
  const svg = evt.target.closest ? evt.target.closest('svg.spark-mini') : null;
  document.querySelectorAll('.sm-hover').forEach(c => { if (!svg || !svg.contains(c)) c.style.opacity = 0; });
  if (!svg) { tip.style.opacity = 0; return; }
  const s = seriesFor(svg.dataset.ref);
  if (!s) return;
  const g = sparkGeom(s.vals), rect = svg.getBoundingClientRect();
  const xv = (evt.clientX - rect.left) / rect.width * g.W;
  const i = Math.max(0, Math.min(g.n - 1, Math.round((xv - g.pad) / (g.W - 2 * g.pad) * (g.n - 1))));
  const dot = svg.querySelector('.sm-hover');
  dot.setAttribute('cx', g.x(i)); dot.setAttribute('cy', g.y(s.vals[i])); dot.style.opacity = 1;
  tip.textContent = `${shortDate(addDays(s.from, i))}: ${fmt(s.vals[i])} ${s.metric}`;
  tip.style.left = (rect.left + g.x(i) / g.W * rect.width) + 'px';
  tip.style.top = (rect.top + g.y(s.vals[i]) / g.H * rect.height) + 'px';
  tip.style.opacity = 1;
}

// ---- Card pieces -------------------------------------------------------------
// One metric: last week -> this week, the change, and whether it is a clear
// change for this video (dir) or within its normal week-to-week swing.
function statRow(label, last, now, dir, f, ref) {
  const change = last ? (now - last) / last * 100 : null;
  const shown = change === null ? (now ? 'from 0' : 'no change') : signedPct(change);
  const delta = dir
    ? `<span class="st-d ${dir > 0 ? 'good' : 'bad'}">${dir > 0 ? '▲' : '▼'} ${shown}</span>`
    : `<span class="st-d flat">${shown} · normal swing</span>`;
  return `<div class="stat"><span class="st-k">${label}</span>
    <span class="st-v">${f(last)} → <b>${f(now)}</b>${delta}</span>${ref ? spark(ref) : ''}</div>`;
}

function detailLabel(source, detail) {
  return source === '5' ? `“${esc(detail)}”` : detailCell(detail);
}

// What drove the change: the traffic sources, each with its top details.
function whyLine(drivers, unit) {
  if (!drivers || !drivers.length) return '';
  const parts = drivers.map(d => {
    const gain = d.this - d.last;
    const det = (d.details || []).map(x => `${detailLabel(d.source, x.detail)} ${signed(x.this - x.last)}`);
    return `<strong>${esc(sourceLabel(d.source))}</strong> ${signed(gain)} ${unit} (${fmt(d.last)} → ${fmt(d.this)})` +
      (det.length ? `: ${det.join(', ')}` : '');
  });
  return `<div class="vc-why"><span class="inl">Why</span>${parts.join(' · ')}</div>`;
}
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));

function learnedText(l) {
  if (!l) return '';
  const where = l.scope === 'here' ? 'in this situation' : 'before';
  const parts = [l.better && `${l.better} better`, l.unclear && `${l.unclear} no clear change`, l.worse && `${l.worse} worse`]
    .filter(Boolean).join(', ');
  const med = l.median_change === null || l.median_change === undefined ? ''
    : ` · median ${l.metric} ${signedPct(l.median_change)}`;
  return `<span class="learned">Tried ${l.tries}× ${where}: ${parts}${med}</span>`;
}

function planList(steps, id, situation) {
  if (!steps || !steps.length) return '';
  return `<ol class="vc-plan">${steps.map(s => {
    const link = s.link && id ? ` <a class="did" href="${studio(id, s.link)}" target="_blank" rel="noopener">Open in Studio ↗</a>` : '';
    const did = s.key && id ? ` <a class="did" href="${logUrl(id, situation, s.key)}" target="_blank" rel="noopener">✓ Did this</a>` : '';
    return `<li>${esc(s.text)}${link}${did}${learnedText(s.learned)}</li>`;
  }).join('')}</ol>`;
}

function resultChip(r, label) {
  if (!r) return `<span class="chip-result flat">${label}: pending</span>`;
  if (r.verdict === 'too little data') return `<span class="chip-result flat">${label}: too little data</span>`;
  const metric = { ctr: 'CTR', views: 'views', search_views: 'search views' }[r.metric] || r.metric;
  const change = r.change === null || r.change === undefined ? '' : ` ${signedPct(r.change)} ${metric}`;
  if (r.verdict === 'unclear') return `<span class="chip-result flat">${label}:${change} (no clear change)</span>`;
  return `<span class="chip-result ${r.verdict === 'better' ? 'good' : 'bad'}">${label}: ${r.verdict === 'better' ? '▲' : '▼'}${change}</span>`;
}

function historyFor(id) {
  const acts = (ATTENTION.actions || []).filter(a => a.video_id === id).slice(0, 2);
  if (!acts.length) return '';
  return `<div class="vc-history"><span class="inl">Done before</span>${acts.map(a =>
    `${esc(KIND_LABEL[a.kind] || a.kind)} on ${shortDate(a.date)}` +
    (a.source === 'detected' ? ' (detected)' : '') + ' — ' +
    ['7', '14', '28'].map(h => resultChip((a.results || {})[h], `${h} days`)).join(' · ')).join('<br>')}</div>`;
}

function buttons(id, situation, extra = '') {
  return `<div class="vc-actions">
    <a class="btn primary" href="${studio(id, 'edit')}" target="_blank" rel="noopener">Edit in Studio</a>
    <a class="btn" href="${studio(id, 'analytics')}" target="_blank" rel="noopener">Reach in Studio</a>
    ${extra}
    <button type="button" class="btn" data-focus="${esc(id)}">Show in table</button>
    <a class="btn" href="${logUrl(id, situation)}" target="_blank" rel="noopener">Log action</a>
  </div>`;
}

function videoCard(c) {
  const id = c.video_id, v = (ATTENTION.videos || {})[id] || {}, s = c.signals;
  const how = HOW_LABEL[s[c.lead].how];
  const flags = (c.flags || []).map(f => `<span class="tag">${f === 'comments' ? 'comments ▲' : 'dislikes ▲'}</span>`).join('');
  const comments = c.situation === 'conversation' || (c.flags || []).includes('comments')
    ? `<a class="btn" href="${studio(id, 'comments')}" target="_blank" rel="noopener">Comments</a>` : '';
  return `<article class="vcard">
    <div>
      <div class="vc-meta">${c.first_seen === ATTENTION.data_through ? '<span class="att-new">New</span>' : ''}
        ${v.game ? `<span class="tag">${esc(v.game)}</span>` : ''}${how ? `<span class="tag how">${how}</span>` : ''}${flags}
        <span>${v.age_days === null || v.age_days === undefined ? '' : esc(ageLabel(v.age_days))}</span></div>
      <h4 class="vc-title"><a href="${studio(id, 'edit')}" target="_blank" rel="noopener">${esc(attTitle(id))}</a></h4>
    </div>
    <div class="vc-stats">
      ${statRow('Impressions', s.impressions.weeks[1], s.impressions.weeks[2], s.impressions.dir, fmt, `v|${id}|impressions`)}
      ${statRow('CTR', s.ctr.last, s.ctr.this, s.ctr.dir, pct, null)}
      ${statRow('Views', s.views.weeks[1], s.views.weeks[2], s.views.dir, fmt, `v|${id}|views`)}
    </div>
    ${whyLine(c.drivers, c.lead === 'impressions' ? 'impressions' : 'views')}
    ${planList(c.plan, id, c.situation)}
    ${buttons(id, c.situation, comments)}
    ${historyFor(id)}
  </article>`;
}

function gameCard(g) {
  const up = g.direction > 0, t = g.totals;
  const dirOf = (a, b) => (b - a) / Math.max(a, 1) >= 0.1 ? 1 : (a - b) / Math.max(a, 1) >= 0.1 ? -1 : 0;
  const rows = g.members.map(m => {
    const flags = [m.situation === 'packaging' ? '<span class="tag how">reach ▲ clicks ▼ → test thumbnail</span>' : '',
                   ...(m.flags || []).map(f => `<span class="tag">${f} ▲</span>`)].join(' ');
    return `<tr><td><a href="${studio(m.video_id, 'edit')}" target="_blank" rel="noopener">${esc(attTitle(m.video_id))}</a> ${flags}</td>
      <td>${fmt(m.impressions[0])} → <b>${fmt(m.impressions[1])}</b></td>
      <td>${fmt(m.views[0])} → <b>${fmt(m.views[1])}</b></td>
      <td>${pct(m.ctr[0])} → ${pct(m.ctr[1])}</td>
      <td><a class="btn small" href="${logUrl(m.video_id, m.situation)}" target="_blank" rel="noopener">Log</a></td></tr>`;
  }).join('');
  return `<article class="vcard">
    <div>
      <div class="vc-meta">${g.first_seen === ATTENTION.data_through ? '<span class="att-new">New</span>' : ''}
        <span class="tag">Game</span><span>${g.members.length} videos moving together</span></div>
      <h4 class="vc-title">${esc(g.label)} ${up ? 'is waking up' : 'is cooling down'}</h4>
    </div>
    <div class="vc-stats">
      ${statRow('Impressions', t.impressions[1], t.impressions[2], dirOf(t.impressions[1], t.impressions[2]), fmt, `g|${g.game}|impressions`)}
      ${statRow('Views', t.views[1], t.views[2], dirOf(t.views[1], t.views[2]), fmt, `g|${g.game}|views`)}
    </div>
    ${planList(g.plan, null, null)}
    <details class="members"><summary>Show the ${g.members.length} videos</summary>
      <div class="scroll-x"><table class="mtable"><thead><tr><th>Video (opens Studio)</th><th>Impressions</th><th>Views</th><th>CTR</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </details>
  </article>`;
}

function earlyHtml(E) {
  const out = [];
  if ((E.flares || []).length) {
    out.push('<h4>Games that flared on one day</h4>' + E.flares.map(f => `<div class="early-row">
      <div><b>${esc(f.label)}</b> flared on ${shortDate(f.date)}: ${f.videos} of ${f.of} videos spiked together,
        ${fmt(f.impressions)} impressions that day against ${fmt(f.usual)} usually. Likely news: an update, DLC,
        sale or trailer. Not a trend yet.</div></div>`).join(''));
  }
  const row = (id, text) => `<div class="early-row"><div><a href="${studio(id, 'edit')}" target="_blank" rel="noopener"><b>${esc(attTitle(id))}</b></a><br>${text}</div>
    <div class="vc-actions"><a class="btn small" href="${studio(id, 'analytics')}" target="_blank" rel="noopener">Reach in Studio</a>
    <button type="button" class="btn small" data-focus="${esc(id)}">Show in table</button></div></div>`;
  if ((E.today || []).length) {
    out.push('<h4>Moving today (public view counter)</h4>' + E.today.map(t =>
      row(t.video_id, `${fmt(t.views.now)} views a day by the public counter, usually ${fmt(t.views.usual)}` +
        (t.comments > 0 ? ` · +${fmt(t.comments)} comments` : ''))).join(''));
  }
  if ((E.building || []).length) {
    out.push('<h4>Building: up three days running</h4>' + E.building.map(b =>
      row(b.video_id, `${b.metric} up three days running: ${fmt(b.weeks[1])} last week, ${fmt(b.weeks[2])} this week so far.`)).join(''));
  }
  return out.join('');
}

function topicsHtml(T) {
  const boxes = [['search', 'Search terms', 'Search term'], ['external', 'Outside sites', 'Site'],
                 ['suggested', "Other channels' videos", 'Suggesting video']].map(([k, title, col]) => {
    const rows = (T[k] || []).slice(0, 10).map(t => `<tr>
      <td>${t.first_seen === ATTENTION.data_through ? '<span class="att-new">New</span> ' : ''}${detailLabel(k === 'search' ? '5' : '', t.detail)}</td>
      <td>${fmt(t.last)} → <b>${fmt(t.this)}</b></td>
      <td style="text-align:left;white-space:normal">${(t.videos || []).map(v =>
        `<a href="${studio(v.video_id, 'edit')}" target="_blank" rel="noopener">${esc(attTitle(v.video_id))}</a>`).join('<br>')}</td></tr>`).join('');
    return rows ? `<div class="box"><h4>${title}</h4><div class="scroll-x"><table class="att-table"><thead><tr><th>${col}</th>
      <th>Views last → this week</th><th style="text-align:left">Lands on</th></tr></thead><tbody>${rows}</tbody></table></div></div>` : '';
  }).join('');
  return boxes ? `<div class="topics">${boxes}</div>` : '';
}

function learnedHtml(A) {
  // Per situation; the "any situation" summary only where an action was tried in several.
  const acts = A.actions || [], all = A.playbook || [];
  const spread = k => all.filter(p => p.kind === k && p.situation !== '*').length;
  const book = all.filter(p => p.situation !== '*' || spread(p.kind) > 1);
  const intro = `<p class="empty-state">${acts.length ? '' : 'Nothing measured yet. '}Use <b>✓ Did this</b> on a suggestion
    or <b>Log action</b> on any card. Title, description, tag and thumbnail changes are picked up on their own.
    Each action is measured 7, 14 and 28 days later against the same days before it.</p>`;
  const pb = book.length ? `<div class="scroll-x"><table class="att-table"><thead><tr><th>What you did</th><th>When it was</th>
      <th>Tries</th><th>Better</th><th>No clear change</th><th>Worse</th><th>Median change</th></tr></thead><tbody>${book.map(p => `<tr>
      <td>${esc(p.label)}</td><td>${esc(SITUATION_LABEL[p.situation] || p.situation)}</td><td>${p.tries}</td>
      <td class="good">${p.better}</td><td>${p.unclear}</td><td class="bad">${p.worse}</td>
      <td>${p.median_change === null ? '—' : `${signedPct(p.median_change)} ${esc(p.metric)}`}</td></tr>`).join('')}</tbody></table></div>` : '';
  const recent = acts.length ? `<h4 style="margin:16px 0 4px;font-size:15px">Recent actions</h4><div class="scroll-x"><table class="att-table">
      <thead><tr><th>Video</th><th>What</th><th>Date</th><th>Recorded</th><th>Results</th></tr></thead><tbody>${acts.slice(0, 20).map(a => `<tr>
      <td><a href="${studio(a.video_id, 'edit')}" target="_blank" rel="noopener">${esc(attTitle(a.video_id))}</a></td>
      <td>${esc(KIND_LABEL[a.kind] || a.kind)}</td><td>${shortDate(a.date)}</td>
      <td>${a.issue ? `<a href="${esc(a.issue.url)}" target="_blank" rel="noopener">logged #${a.issue.number}</a>` : 'detected'}</td>
      <td style="text-align:left">${['7', '14', '28'].map(h => resultChip((a.results || {})[h], `${h}d`)).join(' · ')}</td></tr>`).join('')}
      </tbody></table></div>` : '';
  return intro + pb + recent +
    `<div class="vc-actions" style="margin-top:12px"><a class="btn" href="https://github.com/${REPO}/issues/new?template=log-action.yml" target="_blank" rel="noopener">Log an action</a></div>`;
}

// ---- Groups ------------------------------------------------------------------
const GROUPS = [
  { key: 'packaging', title: 'Fix the packaging',
    what: 'CTR fell on its own last week: impressions came (or held) but clicks did not follow. A thumbnail test or a title refresh is the move.',
    body: A => A.cards.filter(c => c.situation === 'packaging' || c.situation === 'clicks').map(videoCard) },
  { key: 'games-up', title: 'Games waking up',
    what: 'Several older videos of one game moved up together: the topic is active again.',
    body: A => (A.games || []).filter(g => g.direction > 0).map(gameCard) },
  { key: 'wave', title: 'Ride the wave',
    what: 'Impressions or views clearly up on the video\'s own last week. Point the new viewers onward.',
    body: A => A.cards.filter(c => c.situation === 'wave').map(videoCard) },
  { key: 'early', title: 'Early signals',
    what: 'Not confirmed by a full week yet. Worth a look before it shows in the weekly numbers.',
    raw: A => { const E = A.early || {}; return earlyHtml(E); },
    count: A => { const E = A.early || {}; return (E.flares || []).length + (E.today || []).length + (E.building || []).length; } },
  { key: 'losing', title: 'Losing reach',
    what: 'Clearly down on the video\'s own last week. The source that dropped shows where to look.',
    body: A => A.cards.filter(c => c.situation === 'losing').map(videoCard)
      .concat((A.games || []).filter(g => g.direction < 0).map(gameCard)) },
  { key: 'conversation', title: 'Conversation',
    what: 'Far more comments or dislikes than last week.',
    body: A => A.cards.filter(c => c.situation === 'conversation').map(videoCard) },
  { key: 'topics', title: 'Searches and sites on the rise',
    what: 'Search terms, outside sites and other channels\' videos sending clearly more views than last week.',
    raw: A => topicsHtml(A.topics || {}),
    count: A => Object.values(A.topics || {}).reduce((n, es) => n + es.length, 0) },
  { key: 'learned', title: 'Actions and what worked', always: true, closed: true,
    what: 'What you did, and how each video did 7, 14 and 28 days later.',
    raw: A => learnedHtml(A), count: A => (A.actions || []).length },
];

const OPEN_KEY = 'yt-analyzer-open';
function openState() { try { return JSON.parse(localStorage.getItem(OPEN_KEY) || '{}'); } catch (e) { return {}; } }
function rememberOpen(key, open) {
  try { const s = openState(); s[key] = open; localStorage.setItem(OPEN_KEY, JSON.stringify(s)); } catch (e) { /* private mode */ }
}

function renderAttention() {
  const el = document.getElementById('attention');
  const A = ATTENTION;
  if (!A || !A.cards) {
    el.innerHTML = `<p class="quiet">The new view appears after the next collector run, which writes <code>data/attention.json</code>.</p>`;
    return;
  }
  document.getElementById('att-range').textContent =
    `${shortDate(A.this_week.from)}–${shortDate(A.this_week.to)} vs ${shortDate(A.last_week.from)}–${shortDate(A.last_week.to)} · every video against its own last week`;
  const HEALTH = { error: 'error', warn: 'warn', info: '' };
  const health = (A.health || []).length
    ? `<div class="att-health">${A.health.map(h => `<div class="att-h ${HEALTH[h.level] || ''}">${esc(h.message)}</div>`).join('')}</div>` : '';
  const saved = openState(), quiet = [];
  let html = '';
  for (const g of GROUPS) {
    const cards = g.body ? g.body(A) : null;
    const raw = g.raw ? g.raw(A) : '';
    const n = cards ? cards.length : g.count(A);
    if (!n && !g.always) { quiet.push(g.title.toLowerCase()); continue; }
    const open = saved[g.key] !== undefined ? saved[g.key] : !g.closed;
    const all = showAll.has(g.key);
    const content = cards
      ? `<div class="cards">${(all ? cards : cards.slice(0, CARDS_SHOWN)).join('')}</div>` +
        (cards.length > CARDS_SHOWN ? `<p style="margin:12px 0 0"><button type="button" class="btn" data-more="${g.key}">${all ? 'Show fewer' : `Show all ${cards.length}`}</button></p>` : '')
      : `<div class="${g.key === 'early' ? 'early' : ''}">${raw}</div>`;
    html += `<details class="group" data-key="${g.key}" ${open ? 'open' : ''}>
      <summary><span class="fold">▶</span><h3>${g.title}</h3>${n ? `<span class="count">${n}</span>` : ''}
        <span class="group-what">${g.what}</span></summary>
      <div class="group-body">${content}</div></details>`;
  }
  const list = quiet.length > 1 ? quiet.slice(0, -1).join(', ') + ' or ' + quiet[quiet.length - 1] : quiet[0];
  el.innerHTML = health + html + (quiet.length ? `<p class="quiet">Nothing this week in ${list}.</p>` : '');
}

// "Show in table": filter the table down to the video and open its breakdown.
