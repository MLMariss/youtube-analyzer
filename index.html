<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MLMariss · YouTube analytics</title>
<style>
  /* Palette: validated data-viz reference instance (light + dark, theme-aware).
     Dark values are declared under both the media query (OS setting) and the
     [data-theme] scope (manual toggle), so the toggle wins either way. */
  :root {
    color-scheme: light;
    --plane:      #f9f9f7;   /* page background */
    --surface:    #ffffff;   /* cards, table */
    --surface-2:  #f4f4f1;   /* insets, expanded rows, hover */
    --text:       #0b0b0b;
    --text-2:     #52514e;
    --muted:      #898781;
    --grid:       #e1e0d9;
    --line:       #e6e5df;
    --baseline:   #c3c2b7;
    --border:     rgba(11,11,11,0.10);
    --accent:     #2a78d6;   /* series-1 blue */
    --accent-100: #cde2fb;   /* sequential step 100 */
    --accent-ink: #ffffff;   /* text on accent */
    --good:       #0ca30c;
    --warn:       #b8860b;   /* amber, contrast-safe on light */
    --bad:        #d03b3b;
    --shadow:     0 1px 2px rgba(11,11,11,.04), 0 2px 8px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:     #0d0d0d;
      --surface:   #1a1a19;
      --surface-2: #232320;
      --text:      #ffffff;
      --text-2:    #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --line:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --accent:    #3987e5;
      --accent-100:#184f95;
      --accent-ink:#ffffff;
      --good:      #3fc43f;
      --warn:      #fab219;
      --bad:       #ec6a6a;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:     #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #232320;
    --text:      #ffffff;
    --text-2:    #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --line:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --accent:    #3987e5;
    --accent-100:#184f95;
    --accent-ink:#ffffff;
    --good:      #3fc43f;
    --warn:      #fab219;
    --bad:       #ec6a6a;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--plane); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .stamp { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1 1 auto; }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); }

  /* Full-width fluid layout: content fills the viewport, no left-pinned cap. */
  .wrap { padding: 22px 28px 90px; width: 100%; }

  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .metric .label {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; display: flex; align-items: center; gap: 5px;
  }
  .metric .value {
    font-size: 22px; font-weight: 650; margin-top: 4px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .metric .sub { color: var(--muted); font-size: 11px; margin-top: 1px; }

  .info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--muted); color: var(--muted);
    font-size: 9px; font-weight: 700; cursor: help; flex: none;
    font-style: normal; line-height: 1;
  }
  .info:hover { color: var(--text); border-color: var(--text); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card-pad { padding: 14px 16px; }

  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .toolbar .grp { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { color: var(--muted); font-size: 12px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }

  button, select, input {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--baseline); }
  .seg button { border-radius: 0; border-left-width: 0; }
  .seg button:first-child { border-radius: 7px 0 0 7px; border-left-width: 1px; }
  .seg button:last-child { border-radius: 0 7px 7px 0; }
  button.active {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600;
  }
  input[type=search], input[type=date], input[type=number] { cursor: text; }
  input[type=search] { min-width: 190px; }
  input[type=date] { min-width: 140px; }
  input[type=number] { width: 110px; }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .chip {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; font-size: 12px; color: var(--text-2);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child {
    text-align: left; white-space: normal; min-width: 260px; font-variant-numeric: normal;
  }
  thead th {
    color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    position: sticky; top: 57px; background: var(--surface); z-index: 5;
  }
  thead th:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th .arrow { font-size: 9px; opacity: .8; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--surface-2); }
  tbody tr.row.open { background: var(--surface-2); }
  .title-cell { display: flex; gap: 11px; align-items: center; }
  .title-cell img { width: 68px; height: 38px; object-fit: cover; border-radius: 5px; flex: none; }
  .title-cell .t { font-weight: 550; }
  .title-cell .sub { color: var(--muted); font-size: 11px; }
  .caret { color: var(--muted); font-size: 10px; margin-right: 5px; display: inline-block; width: 8px; }
  td.detail { text-align: left; white-space: normal; background: var(--surface-2); padding: 0; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 16px; }
  .panel-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .panel-box h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .panel-box table { font-size: 12px; }
  .panel-box th, .panel-box td { padding: 5px 7px; border-bottom: 1px solid var(--line); }
  .panel-box th:first-child, .panel-box td:first-child { min-width: 0; }
  .panel-box thead th { position: static; }
  /* Fixed column widths so stacked breakdown tables (Device above OS, and the
     panels next to each other) line their Views/Share columns up exactly. */
  .panel-box table.mini { table-layout: fixed; }
  .panel-box table.mini col.c-val   { width: 64px; }
  .panel-box table.mini col.c-share { width: 54px; }
  .panel-box table.mini col.c-src   { width: 38%; }
  .panel-box table.mini td, .panel-box table.mini th { overflow: hidden; text-overflow: ellipsis; }
  .panel-box table.mini + table.mini { margin-top: 10px; }
  .panel-box td.grp {
    vertical-align: top; color: var(--text-2); font-weight: 550;
    border-right: 1px solid var(--line); white-space: normal;
  }
  .panel-box .muted { color: var(--muted); }

  .empty { color: var(--muted); font-size: 12px; font-style: italic; }
  .bar { height: 4px; background: var(--accent); border-radius: 999px; display: block; margin-top: 4px; opacity: .55; }
  .bar.wt { background: var(--accent); opacity: .35; }

  .notice {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--warn); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px; font-size: 13px; box-shadow: var(--shadow);
  }
  .notice.error { border-left-color: var(--bad); }
  .notice code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .hidden { display: none; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  /* Chart */
  .spark-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .spark-title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
  .spark-peak { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  svg.spark { display: block; width: 100%; height: 120px; overflow: visible; }
  .sp-tip {
    position: absolute; pointer-events: none; background: var(--text); color: var(--surface);
    padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -130%); opacity: 0; transition: opacity .08s; font-variant-numeric: tabular-nums;
  }

  /* Needs attention */
  .att-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .att-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .att-health { padding: 10px 16px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
  .att-h { font-size: 12.5px; color: var(--text-2); display: flex; gap: 8px; align-items: baseline; }
  .att-h .ico { flex: none; font-weight: 700; width: 14px; text-align: center; }
  .att-group { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .att-group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
  .att-group-head h3 {
    margin: 0; font-size: 11px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .att-count { color: var(--text-2); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .att-rule { color: var(--muted); font-size: 12px; }
  .att-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 160px minmax(190px, auto);
    gap: 6px 18px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .att-group-head + .att-row { border-top: 0; }
  .att-title { font-weight: 550; }
  .att-title a { color: var(--text); text-decoration: none; }
  .att-title a:hover { text-decoration: underline; }
  .att-sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .att-sub a, button.link { color: var(--accent); text-decoration: none; }
  button.link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  button.link:hover, .att-sub a:hover { text-decoration: underline; }
  .att-drivers { font-size: 12px; color: var(--text-2); margin-top: 4px; display: grid; gap: 2px; }
  .att-drivers b { font-weight: 600; color: var(--text); }
  .att-drivers a { color: var(--accent); }
  .att-nums { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .att-nums > div { white-space: nowrap; }
  .att-nums .muted, .att-drivers .muted, .att-pill .muted { color: var(--muted); }
  .att-delta { font-weight: 650; margin-left: 6px; }
  .att-new {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--accent-ink); background: var(--accent);
    border-radius: 4px; padding: 1px 5px; margin-right: 7px; vertical-align: 1px;
  }
  .att-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .att-pill {
    font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; color: var(--text-2); font-variant-numeric: tabular-nums;
  }
  .att-pill b { color: var(--text); font-weight: 600; }
  /* Trend: 56 days, the recent week in the accent over the de-emphasised past. */
  svg.att-spark { width: 160px; height: 36px; display: block; overflow: visible; cursor: crosshair; }
  .att-spark-base { stroke: var(--baseline); stroke-width: 1; }
  .att-spark-old {
    fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .75;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .att-spark-new {
    fill: none; stroke: var(--accent); stroke-width: 2;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .att-spark-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
  .att-spark-hover { fill: var(--text); stroke: var(--surface); stroke-width: 1.5; opacity: 0; }
  .att-more { margin: 4px 0 2px; font-size: 12px; padding: 4px 10px; }
  .att-topics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px; margin-top: 8px;
  }
  .att-topics td:last-child { text-align: left; white-space: normal; }
  .att-topics a { color: var(--accent); text-decoration: none; }
  .att-quiet { color: var(--muted); font-size: 12px; padding: 10px 16px 12px; margin: 0; }
  .att-tip {
    position: fixed; pointer-events: none; background: var(--text); color: var(--surface);
    padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -135%); opacity: 0; transition: opacity .08s;
    font-variant-numeric: tabular-nums; z-index: 30;
  }
  @media (max-width: 720px) {
    .att-row { grid-template-columns: minmax(0, 1fr); }
    .att-nums { text-align: left; }
  }

  /* Glossary */
  details.glossary { margin-bottom: 16px; }
  details.glossary > summary {
    cursor: pointer; color: var(--text-2); font-size: 13px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    list-style: none; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
  }
  details.glossary > summary::-webkit-details-marker { display: none; }
  details.glossary[open] > summary { border-radius: 10px 10px 0 0; }
  .gloss-body {
    background: var(--surface); border: 1px solid var(--border); border-top: 0;
    border-radius: 0 0 10px 10px; padding: 4px 16px 14px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px 24px;
  }
  .gloss-body dt { font-weight: 650; margin-top: 12px; font-size: 13px; }
  .gloss-body dd { margin: 2px 0 0; color: var(--text-2); font-size: 12.5px; }
  .gloss-body .src { color: var(--muted); font-size: 11px; }
  .gloss-body a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>MLMariss · YouTube analytics</h1>
    <span class="stamp" id="stamp">loading…</span>
  </div>
  <span class="spacer"></span>
  <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark">
    <span id="theme-icon">◐</span><span id="theme-label">Theme</span>
  </button>
</header>

<div class="wrap">

  <div id="notice" class="notice hidden"></div>

  <section class="card" id="attention" aria-label="Needs attention"></section>
  <div class="att-tip" id="att-tip"></div>

  <div class="metrics" id="metrics"></div>

  <details class="glossary" id="glossary">
    <summary><span class="info">i</span> What do these metrics mean?</summary>
    <dl class="gloss-body" id="gloss-body"></dl>
  </details>

  <div class="card">
    <div class="toolbar">
      <div class="grp seg" role="group" aria-label="Time window">
        <button data-window="7d">7 days</button>
        <button data-window="28d">28 days</button>
        <button data-window="90d" class="active">90 days</button>
        <button data-window="365d">365 days</button>
        <button data-window="all">All time</button>
      </div>
      <span class="spacer"></span>
      <div class="grp">
        <input type="search" id="f-text" placeholder="Filter titles…" />
        <span class="sep"></span>
        <span class="lbl">Published</span>
        <div class="grp seg" role="group" aria-label="Publish-date preset">
          <button type="button" data-pub="all" class="active">Any</button>
          <button type="button" data-pub="7">7d</button>
          <button type="button" data-pub="28">28d</button>
          <button type="button" data-pub="90">90d</button>
          <button type="button" data-pub="365">1y</button>
        </div>
        <input type="date" id="f-from" title="Published on or after" />
        <span class="lbl">→</span>
        <input type="date" id="f-to" title="Published on or before" />
        <span class="sep"></span>
        <span class="lbl">Format</span>
        <select id="f-format">
          <option value="all">All</option>
          <option value="short">Shorts (≤60s)</option>
          <option value="long">Long-form</option>
        </select>
        <span class="sep"></span>
        <span class="lbl">Source</span>
        <select id="f-source"><option value="all">Any</option></select>
        <span class="sep"></span>
        <span class="lbl">Min views</span>
        <input type="number" id="f-minviews" min="0" step="10" placeholder="0" />
        <button id="f-reset">Reset</button>
        <span class="chip" id="f-count"></span>
      </div>
    </div>

    <div class="card-pad" id="spark-wrap" style="position:relative">
      <div class="spark-head">
        <span class="spark-title">Impressions per day</span>
        <span class="spark-peak" id="spark-peak"></span>
      </div>
      <svg id="spark" class="spark hidden"></svg>
      <div class="sp-tip" id="sp-tip"></div>
    </div>
  </div>

  <div id="channel-traffic"></div>

  <div class="card">
    <table id="tbl">
      <thead>
        <tr id="head-row"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</div>

<script>
// This dashboard is read-only. There is no OAuth, no API key and no login:
// the GitHub Actions collector writes data/*.json and this page just reads it.
let SUMMARY = null, DAILY = null, TRAFFIC = null, TDETAIL = null,
    DEVICES = null, DEMOGRAPHICS = null;
// Default sort: newest uploads first, so the table opens on your latest videos.
let currentWindow = '90d', sortKey = 'publishedTs', sortDir = -1;
let expanded = null;
const F = { text: '', from: '', to: '', format: 'all', source: 'all', minViews: 0 };

// ---- Traffic source labels -------------------------------------------------
// The Reporting API encodes traffic_source_type as an integer code. This maps
// the codes YouTube documents to readable names; unknown codes fall back to
// "Source N" so nothing is ever a bare number.
// Refs: developers.google.com/youtube/reporting/v1/reports/dimensions
const SOURCE_LABELS = {
  '0': 'Direct or unknown',
  '1': 'YouTube advertising',
  '3': 'Browse features',
  '4': 'Channel pages',
  '5': 'YouTube search',
  '7': 'Suggested videos',
  '8': 'Other YouTube features',
  '9': 'External',
  '11': 'Cards',
  '14': 'Playlists',
  '17': 'Notifications',
  '18': 'Playlist page',
  '19': 'Claimed content',
  '20': 'End screens',
  '24': 'Shorts feed',
  '25': 'Product pages',
  '26': 'Hashtag pages',
  '27': 'Video remixes',
  '28': 'Live redirects',
  'UNKNOWN': 'Unknown',
};
const sourceLabel = code => {
  const k = String(code);
  return SOURCE_LABELS[k] || (/^\d+$/.test(k) ? `Source ${k}` : k);
};

// ---- Device / OS / demographic decoding ------------------------------------
// device_type and operating_system come from the Reporting API as integer
// codes. Google no longer publishes the integer->name table (the docs show
// string names now), so these were recovered from this channel's own data by
// cross-referencing which OS runs on which device: the single biggest OS (2)
// is desktop-only -> Windows, so its device (101) is Computer; OS 4 shows up on
// phones, tablets and TVs but never desktop -> Android; the TV device carries
// Chromecast (21). Codes we can't confirm (the long tail of smart-TV and
// game-console OSes, all tiny) fall back to "OS N"/"Device N" so a raw number
// is never shown on its own.
const DEVICE_LABELS = {
  '100': 'Unknown', '101': 'Computer', '102': 'TV',
  '103': 'Game console', '104': 'Mobile phone', '105': 'Tablet',
};
const OS_LABELS = {
  '1': 'Other', '2': 'Windows', '4': 'Android',
  '5': 'iOS', '9': 'macOS', '21': 'Chromecast',
};
const deviceLabel = c => DEVICE_LABELS[String(c)] || `Device ${esc(c)}`;
const osLabel = c => OS_LABELS[String(c)] || `OS ${esc(c)}`;

const AGE_LABELS = {
  'AGE_13_17': '13–17', 'AGE_18_24': '18–24', 'AGE_25_34': '25–34',
  'AGE_35_44': '35–44', 'AGE_45_54': '45–54', 'AGE_55_64': '55–64',
  'AGE_65_': '65+',
};
const GENDER_LABELS = {
  'MALE': 'Male', 'FEMALE': 'Female',
  'USER_SPECIFIED': 'User-specified', 'GENDER_OTHER': 'Other', 'UNKNOWN': 'Unknown',
};
// "AGE_25_34/MALE" -> "25–34 · Male".
function demoLabel(key) {
  const [age, gender] = String(key).split('/');
  const a = AGE_LABELS[age] || esc(age);
  const g = GENDER_LABELS[gender] || (gender ? esc(gender) : '');
  return g ? `${a} · ${g}` : a;
}

// Browse-feature detail slugs are cryptic; name the common ones. Everything
// else is shown exactly as YouTube returned it (a search term, a domain, …).
const BROWSE_DETAIL = {
  'what-to-watch': 'Home / What to watch',
  '/my_subscriptions': 'Subscriptions feed',
  'my-history': 'Watch history',
  'watch-later': 'Watch later',
  'uploaded_other': 'Your channel uploads',
};
const VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;
const CHANNEL_ID_RE = /^UC[A-Za-z0-9_-]{22}$/;
// A referrer detail is often an opaque video/channel ID, which is exactly the
// "numbers mean nothing" problem — so link IDs out to the actual video/channel.
function detailCell(detail) {
  const d = String(detail);
  if (BROWSE_DETAIL[d]) return esc(BROWSE_DETAIL[d]);
  if (d === 'unknown' || d === 'NULL') return '<span class="muted">unknown</span>';
  if (VIDEO_ID_RE.test(d)) {
    // Prefer the video's title when it is one of our own uploads; external
    // videos aren't in video_meta, so those keep the raw ID as the link text.
    const meta = (SUMMARY && SUMMARY.video_meta) || {};
    const title = meta[d] && meta[d].title;
    return `<a href="https://www.youtube.com/watch?v=${encodeURIComponent(d)}" target="_blank" rel="noopener">${title ? esc(title) : esc(d)}</a>`;
  }
  if (CHANNEL_ID_RE.test(d))
    return `<a href="https://www.youtube.com/channel/${encodeURIComponent(d)}" target="_blank" rel="noopener">${esc(d)}</a>`;
  return esc(d);
}

// ---- Metric definitions (YouTube documentation) ----------------------------
const METRICS = {
  impressions: ['Impressions',
    'How many times your thumbnails were shown to viewers on YouTube. Counts only YouTube surfaces (not external sites), when at least 50% of the thumbnail was on screen for more than one second.'],
  ctr: ['Click-through rate (CTR)',
    'The share of thumbnail impressions that turned into views — clicks ÷ impressions. Computed here as total clicks over total impressions across the window, never an average of daily rates.'],
  views: ['Views', 'The number of legitimate views of your videos in the window.'],
  avg_view_percentage: ['Retention (average % viewed)',
    'The average percentage of the video that viewers watched. Can exceed 100% when parts are re-watched or looped.'],
  watch_time_minutes: ['Watch time',
    "Total minutes viewers spent watching. YouTube's primary discovery signal — it favours total watch time, not just views."],
  wt_share: ['Watch-time share',
    'This video’s share of the total watch time across the videos currently in view (after filters). Shows which uploads carry the channel. Custom metric, not from YouTube.'],
  subscribers_gained: ['Subscribers gained',
    'Subscribers gained that YouTube attributes to the video during the window (before subtracting any lost).'],
  engagement: ['Engagement rate',
    '(likes + comments + shares) ÷ views, as a percentage. A custom interaction rate — not an official YouTube metric.'],
  avg_view_seconds: ['Average view duration',
    'The average length of a single playback (time watched ÷ views).'],
};

const COLS = [
  { key: 'title',              label: 'Video',      m: null },
  { key: 'publishedTs',        label: 'Published',  m: null },
  { key: 'impressions',        label: 'Impressions', m: 'impressions' },
  { key: 'ctr',                label: 'CTR',        m: 'ctr' },
  { key: 'views',              label: 'Views',      m: 'views' },
  { key: 'avg_view_percentage',label: 'Retention',  m: 'avg_view_percentage' },
  { key: 'watch_time_minutes', label: 'Watch time', m: 'watch_time_minutes' },
  { key: 'wt_share',           label: 'WT share',   m: 'wt_share' },
  { key: 'subscribers_gained', label: 'Subs',       m: 'subscribers_gained' },
  { key: 'engagement',         label: 'Engagement', m: 'engagement' },
];
const COLSPAN = COLS.length;

// Titles come from YouTube and search terms in traffic_detail.json are typed by
// viewers, so everything interpolated into innerHTML must be escaped properly.
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                               '"': '&quot;', "'": '&#39;' }[c]));

const fmt = n => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  n = Number(n);
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.round(n).toLocaleString();
};
const pct = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1) + '%';
const mins = m => {
  if (!m) return '—';
  const h = Math.floor(m/60), r = Math.round(m%60);
  return h > 0 ? `${h}h ${r}m` : `${r}m`;
};
// h:mm:ss past an hour, m:ss below it. Plenty of these videos run over two
// hours, so a bare m:ss would read as "128:03".
const secs = s => {
  if (s === null || s === undefined || isNaN(s)) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = Math.round(s%60);
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
};

// "PT2H8M3S" -> 7683. Used for the Shorts/long-form split and the duration label.
function durationSeconds(iso) {
  if (!iso) return null;
  const m = /^P(?:\d+D)?T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso);
  if (!m) return null;
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}

// The breakdown files (traffic / devices / demographics / detail) are keyed by
// the same window names as summary.json, so every breakdown follows the active
// time-window button instead of a fixed 90-day view.
const WINDOW_LABELS = {
  '7d': 'last 7 days', '28d': 'last 28 days', '90d': 'last 90 days',
  '365d': 'last 365 days', 'all': 'all time',
};
function bucketLabel() {
  return WINDOW_LABELS[currentWindow] || currentWindow;
}
function slice(file, id) {
  if (!file) return null;
  const b = file[currentWindow];
  if (!b) return null;
  return id ? (b.videos || {})[id] : (b.channel || null);
}

function notice(html, isError) {
  const el = document.getElementById('notice');
  el.innerHTML = html;
  el.classList.toggle('error', !!isError);
  el.classList.remove('hidden');
}

async function loadJson(path) {
  const r = await fetch(path + '?t=' + Date.now());
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}
// Breakdown files are optional: they do not exist until their reports land.
async function loadOptional(path) {
  try { return await loadJson(path); } catch (e) { return null; }
}

// ---- Theme -----------------------------------------------------------------
function applyTheme(mode) {
  // mode: 'light' | 'dark' | null(=follow system)
  const root = document.documentElement;
  if (mode) root.setAttribute('data-theme', mode);
  else root.removeAttribute('data-theme');
  const dark = mode ? mode === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('theme-icon').textContent = dark ? '☾' : '☀';
  document.getElementById('theme-label').textContent = dark ? 'Dark' : 'Light';
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  applyTheme(saved === 'light' || saved === 'dark' ? saved : null);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = (cur ? cur === 'dark' : sysDark) ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
    renderSpark(); // re-stroke with the new surface colors
  });
}

function buildGlossary() {
  const order = ['impressions','ctr','views','avg_view_percentage','watch_time_minutes',
                 'wt_share','subscribers_gained','engagement','avg_view_seconds'];
  document.getElementById('gloss-body').innerHTML = order.map(k => {
    const [name, desc] = METRICS[k];
    return `<div><dt>${esc(name)}</dt><dd>${esc(desc)}</dd></div>`;
  }).join('') +
    `<div style="grid-column:1/-1;margin-top:12px" class="src">Definitions follow YouTube's ` +
    `<a href="https://support.google.com/youtube/answer/9002587" target="_blank" rel="noopener">Analytics help</a> and the ` +
    `<a href="https://developers.google.com/youtube/reporting/v1/reports/metrics" target="_blank" rel="noopener">Reporting API metrics</a> reference.</div>`;
}

function buildHead() {
  document.getElementById('head-row').innerHTML = COLS.map(c => {
    const t = c.m ? ` title="${esc(METRICS[c.m][0])}: ${esc(METRICS[c.m][1])}"` : '';
    return `<th data-sort="${c.key}"${t}>${esc(c.label)}</th>`;
  }).join('');
  document.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = k === 'title' ? 1 : -1; }
      render();
    });
  });
}

async function init() {
  initTheme();
  buildGlossary();
  buildHead();
  try {
    SUMMARY = await loadJson('data/summary.json');
  } catch (e) {
    document.getElementById('stamp').textContent = 'no data yet';
    notice(
      '<strong>No collected data yet.</strong><br>' +
      'The collector has not produced <code>data/summary.json</code>. If you have just set this up: ' +
      'add the three repository secrets, run the workflow once with <code>create_jobs</code> ticked, ' +
      'then wait up to 48 hours for YouTube to generate the first reports. ' +
      'Roughly 30 days of history are backfilled automatically.<br><br>' +
      '<span style="color:var(--muted)">' + esc(e.message) + '</span>', true);
    return;
  }
  [DAILY, TRAFFIC, TDETAIL, DEVICES, DEMOGRAPHICS, ATTENTION] = await Promise.all([
    loadOptional('data/daily.json'),
    loadOptional('data/traffic.json'),
    loadOptional('data/traffic_detail.json'),
    loadOptional('data/devices.json'),
    loadOptional('data/demographics.json'),
    loadOptional('data/attention.json'),
  ]);

  const when = SUMMARY.generated_at ? new Date(SUMMARY.generated_at) : null;
  // YouTube publishes each day two to three days late, so the newest day with
  // data matters more than when the collector last ran.
  const through = SUMMARY.data_through
    ? new Date(SUMMARY.data_through + 'T00:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC' })
    : null;
  document.getElementById('stamp').textContent = [
    through ? 'data through ' + through : '',
    when ? 'updated ' + when.toLocaleString() : '',
  ].filter(Boolean).join(' · ');

  renderAttention();
  populateSources();
  renderMetrics();
  renderSpark();
  renderChannelTraffic();
  render();
}

function populateSources() {
  const ch = slice(TRAFFIC, null) || {};
  const codes = Object.keys(ch);
  const sel = document.getElementById('f-source');
  const keep = sel.value;
  // Sort options by readable label for a friendlier dropdown.
  codes.sort((a, b) => sourceLabel(a).localeCompare(sourceLabel(b)));
  sel.innerHTML = '<option value="all">Any</option>' +
    codes.map(c => `<option value="${esc(c)}">${esc(sourceLabel(c))}</option>`).join('');
  if (codes.includes(keep)) sel.value = keep;
  else { sel.value = 'all'; F.source = 'all'; }
  sel.disabled = codes.length === 0;
}

function allRows() {
  const w = (SUMMARY.windows || {})[currentWindow] || {};
  const meta = SUMMARY.video_meta || {};
  return Object.keys(w).map(id => {
    const d = w[id], m = meta[id] || {};
    const eng = d.views ? ((d.likes + d.comments + d.shares) / d.views) * 100 : null;
    const dur = durationSeconds(m.duration);
    return Object.assign({
      id, title: m.title || id, thumb: m.thumbnail,
      published: m.published_at || null,
      publishedTs: m.published_at ? Date.parse(m.published_at) : null,
      durationSec: dur, engagement: eng,
    }, d);
  });
}

function currentRows() {
  let rows = allRows();

  if (F.text) {
    const f = F.text.toLowerCase();
    rows = rows.filter(r => (r.title || '').toLowerCase().includes(f));
  }
  if (F.from) {
    const t = Date.parse(F.from + 'T00:00:00Z');
    rows = rows.filter(r => r.publishedTs !== null && r.publishedTs >= t);
  }
  if (F.to) {
    // Inclusive of the chosen day.
    const t = Date.parse(F.to + 'T23:59:59Z');
    rows = rows.filter(r => r.publishedTs !== null && r.publishedTs <= t);
  }
  if (F.format !== 'all') {
    rows = rows.filter(r => {
      if (r.durationSec === null) return false;
      return F.format === 'short' ? r.durationSec <= 60 : r.durationSec > 60;
    });
  }
  if (F.source !== 'all') {
    rows = rows.filter(r => {
      const t = slice(TRAFFIC, r.id);
      return t && t[F.source] && t[F.source].views > 0;
    });
  }
  if (F.minViews > 0) {
    rows = rows.filter(r => (r.views || 0) >= F.minViews);
  }

  // Watch-time share is relative to the visible set, so compute it after
  // filtering and before sorting (so the column is sortable too).
  const totalWt = rows.reduce((s, r) => s + (r.watch_time_minutes || 0), 0);
  rows.forEach(r => {
    r.wt_share = totalWt ? ((r.watch_time_minutes || 0) / totalWt) * 100 : null;
  });

  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'title') return sortDir * String(x).localeCompare(String(y));
    x = (x === null || x === undefined) ? -Infinity : x;
    y = (y === null || y === undefined) ? -Infinity : y;
    return sortDir * (x - y);
  });
  return rows;
}

function renderMetrics() {
  // Metric cards summarise the filtered selection, so they move with the filters.
  const vals = currentRows();
  const imps = vals.reduce((s, v) => s + (v.impressions || 0), 0);
  const views = vals.reduce((s, v) => s + (v.views || 0), 0);
  const wt = vals.reduce((s, v) => s + (v.watch_time_minutes || 0), 0);
  const subs = vals.reduce((s, v) => s + (v.subscribers_gained || 0), 0);
  // Channel CTR must be total clicks over total impressions, never a mean of
  // per-video CTRs, which would weight a 50-impression video like a 50k one.
  const clicks = vals.reduce((s, v) =>
    s + ((v.impressions || 0) * ((v.ctr || 0) / 100)), 0);
  const ctr = imps ? (clicks / imps) * 100 : null;
  const ch = SUMMARY.channel || {};

  const info = k => `<span class="info" title="${esc(METRICS[k][0])}: ${esc(METRICS[k][1])}">i</span>`;
  const cards = [
    ['Subscribers', fmt(ch.subscriber_count), '', null],
    ['Impressions', fmt(imps), '', 'impressions'],
    ['CTR', pct(ctr), 'clicks ÷ impressions', 'ctr'],
    ['Views', fmt(views), '', 'views'],
    ['Watch time', mins(wt), '', 'watch_time_minutes'],
    ['Subs gained', fmt(subs), '', 'subscribers_gained'],
    ['Videos', fmt(vals.length), 'in current filter', null],
  ];
  document.getElementById('metrics').innerHTML = cards.map(
    ([l, v, sub, m]) => `<div class="metric">
      <div class="label">${esc(l)}${m ? info(m) : ''}</div>
      <div class="value">${v}</div>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
    </div>`
  ).join('');
}

// ---- Needs attention -------------------------------------------------------
// monitor.py compares every video's last seven complete days with the 28
// before them and writes what changed to data/attention.json. YouTube Studio
// only watches new uploads; this is the watch on the back catalogue.
let ATTENTION = null;
const ATT_SHOWN = 5;           // rows per group before "Show all"
const attOpen = new Set();     // groups currently showing every row

const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const shortDate = d => new Date(d + 'T00:00:00Z')
  .toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
// Older videos run at a few views a day, so keep one decimal below ten.
const rate = n => (n === null || n === undefined) ? '—'
  : n === 0 ? '0' : (Math.abs(n) < 10 ? Number(n).toFixed(1) : fmt(n));
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const ageLabel = d => d >= 365 ? `${(d / 365).toFixed(1)} years old` : `${d} days old`;
const watchUrl = id => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
const studioUrl = id =>
  `https://studio.youtube.com/video/${encodeURIComponent(id)}/analytics/tab-overview/period-default`;
const attTitle = id => ((ATTENTION.videos || {})[id] || {}).title
  || (((SUMMARY && SUMMARY.video_meta) || {})[id] || {}).title || id;

// The arrow and the figure carry the direction; colour only reinforces it.
function change(before, now, upIsGood = true) {
  if (!before) return now ? `<span class="att-delta ${upIsGood ? 'good' : 'bad'}">↑ from 0</span>` : '';
  const r = now / before;
  if (r >= 1) return `<span class="att-delta ${upIsGood ? 'good' : 'bad'}">↑ ×${r >= 10 ? Math.round(r) : r.toFixed(1)}</span>`;
  return `<span class="att-delta ${upIsGood ? 'bad' : 'good'}">↓ ${Math.round((1 - r) * 100)}%</span>`;
}
const rateLine = (r, unit) =>
  `<div>${rate(r.before)} → <b>${rate(r.now)}</b> ${unit}/day ${change(r.before, r.now)}</div>`;

function sparkGeom(vals) {
  const W = 160, H = 36, pad = 3, n = vals.length, max = Math.max(...vals, 1);
  return { W, H, pad, n,
           x: i => pad + i * (W - 2 * pad) / (n - 1),
           y: v => H - pad - ((v || 0) / max) * (H - 2 * pad) };
}

function attSpark(id, metric) {
  const s = (ATTENTION.series || {})[id];
  const vals = s && s[metric];
  if (!vals || vals.length < 8) return '<span></span>';
  const g = sparkGeom(vals);
  const pts = vals.map((v, i) => `${g.x(i).toFixed(1)},${g.y(v).toFixed(1)}`);
  const split = g.n - 7;   // the recent week
  return `<svg class="att-spark" viewBox="0 0 ${g.W} ${g.H}" data-id="${esc(id)}" data-metric="${metric}"
      role="img" aria-label="${metric} per day over the last ${g.n} days, the last 7 highlighted">
    <line class="att-spark-base" x1="${g.pad}" y1="${g.H - g.pad}" x2="${g.W - g.pad}" y2="${g.H - g.pad}"/>
    <polyline class="att-spark-old" points="${pts.slice(0, split + 1).join(' ')}"/>
    <polyline class="att-spark-new" points="${pts.slice(split).join(' ')}"/>
    <circle class="att-spark-dot" r="3" cx="${g.x(g.n - 1).toFixed(1)}" cy="${g.y(vals[g.n - 1]).toFixed(1)}"/>
    <circle class="att-spark-hover" r="3.5"/>
  </svg>`;
}

function attSparkHover(evt) {
  const tip = document.getElementById('att-tip');
  const svg = evt.target.closest ? evt.target.closest('svg.att-spark') : null;
  document.querySelectorAll('.att-spark-hover').forEach(c => {
    if (!svg || !svg.contains(c)) c.style.opacity = 0;
  });
  if (!svg) { tip.style.opacity = 0; return; }
  const s = ATTENTION.series[svg.dataset.id], metric = svg.dataset.metric, vals = s[metric];
  const g = sparkGeom(vals), rect = svg.getBoundingClientRect();
  const i = Math.max(0, Math.min(g.n - 1,
    Math.round((evt.clientX - rect.left - g.pad) / (rect.width - 2 * g.pad) * (g.n - 1))));
  const dot = svg.querySelector('.att-spark-hover');
  dot.setAttribute('cx', g.x(i)); dot.setAttribute('cy', g.y(vals[i])); dot.style.opacity = 1;
  tip.textContent = `${shortDate(addDays(s.from, i))}: ${fmt(vals[i])} ${metric}`;
  tip.style.left = (rect.left + g.x(i)) + 'px';
  tip.style.top = (rect.top + g.y(vals[i])) + 'px';
  tip.style.opacity = 1;
}

// What drove a rise or fall: the traffic sources, each with its top search
// terms, suggesting videos or referring sites.
function driverLines(drivers) {
  if (!drivers || !drivers.length) return '';
  return `<div class="att-drivers">${drivers.map(d => {
    const details = (d.details || []).map(x =>
      `${d.source === '5' ? `“${esc(x.detail)}”` : detailCell(x.detail)} <span class="muted">${signed(x.gain)}</span>`);
    return `<div><b>${esc(sourceLabel(d.source))}</b> ${signed(d.gain)} views this week` +
      `<span class="muted"> (${rate(d.before)} → ${rate(d.now)}/day)</span>` +
      (details.length ? ` · ${details.join(', ')}` : '') + '</div>';
  }).join('')}</div>`;
}

function attRow(e, { metric = 'views', nums = '', extra = '' } = {}) {
  const id = e.video_id, v = (ATTENTION.videos || {})[id] || {};
  const isNew = e.first_seen === ATTENTION.data_through;
  // Age counts to the newest analytics day, so an upload newer than that has
  // none yet; show its publish date instead.
  const age = v.age_days === null || v.age_days === undefined ? ''
    : v.age_days < 0 ? `published ${shortDate(v.published)} · ` : esc(ageLabel(v.age_days)) + ' · ';
  return `<div class="att-row">
    <div>
      <div class="att-title">${isNew ? '<span class="att-new" title="First flagged in this update">New</span>' : ''}<a
        href="${watchUrl(id)}" target="_blank" rel="noopener">${esc(attTitle(id))}</a></div>
      <div class="att-sub">${age}<a href="${studioUrl(id)}" target="_blank" rel="noopener">Studio ↗</a>
        · <button type="button" class="link" data-focus="${esc(id)}">Show in table</button></div>
      ${extra}
    </div>
    ${attSpark(id, metric)}
    <div class="att-nums">${nums}</div>
  </div>`;
}

const UPLOAD_METRICS = [['views', 'Views', fmt], ['impressions', 'Impressions', fmt],
                        ['ctr', 'CTR', pct], ['avg_view_pct', 'Avg % viewed', pct]];
function uploadRow(e) {
  if (e.pending) return attRow(e, {
    nums: '<div class="muted">analytics in 2–3 days</div>',
    extra: `<div class="att-drivers"><div>Too new for the analytics reports. Public counter:
      <b>${fmt(e.public_views)}</b> views so far.</div></div>`,
  });
  // Rank 1 = best of all uploads at the same age; top and bottom thirds are marked.
  const pills = UPLOAD_METRICS.map(([k, label, f]) => {
    const c = e.compare[k] || {};
    if (c.value === null || c.value === undefined) return '';
    const third = c.of / 3;
    const cls = !c.rank || c.of < 4 ? '' : c.rank <= third ? 'good' : c.rank > c.of - third ? 'bad' : '';
    const mark = cls === 'good' ? '↑ ' : cls === 'bad' ? '↓ ' : '';
    return `<span class="att-pill">${label} <b>${f(c.value)}</b> <span class="${cls}">${mark}#${c.rank} of ${c.of}</span>` +
      (c.typical === null ? '' : ` <span class="muted">· typical ${f(c.typical)}</span>`) + '</span>';
  }).join('');
  const kind = { short: 'Shorts', long: 'long-form uploads', all: 'uploads' }[e.cohort_format] || 'uploads';
  return attRow(e, {
    nums: `<div>Day ${e.days}</div><div class="muted">vs ${e.compare.views.of - 1} ${kind}</div>`,
    extra: `<div class="att-pills">${pills}</div>`,
  });
}

const REACTION_KEYS = { dislikes: 'dislikes', comments: 'comments', unsubscribes: 'subscribers_lost' };

const TOPIC_TITLES = { search: 'Searches', external: 'Outside sites', suggested: "Other channels' videos" };
const TOPIC_COLUMN = { search: 'Search term', external: 'Site', suggested: 'Suggesting video' };
function topicTable(name, entries) {
  if (!entries || !entries.length) return '';
  const key = 'topic-' + name, all = attOpen.has(key);
  const rows = (all ? entries : entries.slice(0, 8)).map(t => {
    const label = name === 'search' ? `“${esc(t.detail)}”` : detailCell(t.detail);
    const lands = (t.videos || []).map(v =>
      `<a href="${watchUrl(v.video_id)}" target="_blank" rel="noopener">${esc(attTitle(v.video_id))}</a>`).join('<br>');
    return `<tr><td>${t.first_seen === ATTENTION.data_through ? '<span class="att-new">New</span>' : ''}${label}</td>
      <td>${rate(t.before)} → <b>${rate(t.now)}</b>${change(t.before, t.now)}</td><td>${lands}</td></tr>`;
  }).join('');
  return `<div class="panel-box"><h3>${TOPIC_TITLES[name]}</h3>
    <table><thead><tr><th>${TOPIC_COLUMN[name]}</th><th>Views/day</th><th style="text-align:left">Lands on</th></tr></thead>
    <tbody>${rows}</tbody></table>
    ${entries.length > 8 ? `<button class="att-more" data-more="${key}">${all ? 'Show fewer' : `Show all ${entries.length}`}</button>` : ''}
  </div>`;
}

function attGroup(key, title, rule, rows) {
  const all = attOpen.has(key);
  return `<div class="att-group">
    <div class="att-group-head"><h3>${title}<span class="att-count">${rows.length}</span></h3>
      <span class="att-rule">${rule}</span></div>
    ${(all ? rows : rows.slice(0, ATT_SHOWN)).join('')}
    ${rows.length > ATT_SHOWN ? `<button class="att-more" data-more="${key}">${all ? 'Show fewer' : `Show all ${rows.length}`}</button>` : ''}
  </div>`;
}

const HEALTH_ICON = { error: ['●', 'bad'], warn: ['▲', 'warn'], info: ['i', 'muted'] };

function renderAttention() {
  const el = document.getElementById('attention');
  const A = ATTENTION;
  if (!A) {
    el.innerHTML = `<div class="att-head"><h2>Needs attention</h2></div>
      <p class="att-quiet">Appears after the next collector run, which writes <code>data/attention.json</code>.</p>`;
    return;
  }
  const head = `<div class="att-head"><h2>Needs attention</h2>
    <span class="stamp">${shortDate(A.recent.from)}–${shortDate(A.recent.to)} compared with the 4 weeks before</span></div>`;
  const health = (A.health || []).length ? `<div class="att-health">${A.health.map(h => {
    const [ico, cls] = HEALTH_ICON[h.level] || HEALTH_ICON.info;
    return `<div class="att-h"><span class="ico ${cls}">${ico}</span><span>${esc(h.message)}</span></div>`;
  }).join('')}</div>` : '';

  const groups = [
    ['moving_today', 'Moving today', 'same-day jumps',
     'Public view counter since the previous collector run, far above the usual — the analytics run 2–3 days behind.',
     (A.moving_today || []).map(e => attRow(e, {
       nums: `<div><b>${fmt(e.views.now)}</b> views/day${change(e.views.usual, e.views.now)}</div>` +
             `<div class="muted">usually ${rate(e.views.usual)}/day</div>`,
       extra: (e.likes > 0 || e.comments > 0) ? `<div class="att-drivers"><div>Since the previous run: ${
         [e.likes > 0 ? `+${fmt(e.likes)} likes` : '', e.comments > 0 ? `+${fmt(e.comments)} comments` : '']
           .filter(Boolean).join(', ')}</div></div>` : '',
     }))],
    ['rising', 'Rising · back catalogue', 'rising older videos',
     'Older than 30 days, views or impressions at least doubled. Worth a pinned comment, a description refresh, cards to newer videos or a follow-up.',
     (A.rising || []).map(e => attRow(e, {
       metric: e.trigger === 'impressions' ? 'impressions' : 'views',
       nums: rateLine(e.views, 'views') + rateLine(e.impressions, 'impr.'),
       extra: driverLines(e.drivers),
     }))],
    ['falling', 'Falling', 'falling videos',
     'Established videos whose views halved. The source that dropped shows where — lost search ranking is often fixable with a title or description refresh.',
     (A.falling || []).map(e => attRow(e, { nums: rateLine(e.views, 'views') + rateLine(e.impressions, 'impr.'),
                                             extra: driverLines(e.drivers) }))],
    ['ctr_drop', 'CTR drop', 'CTR drops',
     'Clicks per impression down 25% or more while impressions held steady: a thumbnail or title test candidate.',
     (A.ctr_drop || []).map(e => attRow(e, {
       metric: 'impressions',
       nums: `<div>CTR ${pct(e.ctr.before)} → <b>${pct(e.ctr.now)}</b>${change(e.ctr.before, e.ctr.now)}</div>` +
             rateLine(e.impressions, 'impr.'),
     }))],
    ['new_uploads', 'New uploads', 'recent uploads',
     'First 28 days, against your other uploads at the same age. #1 is the best of them.',
     (A.new_uploads || []).map(uploadRow)],
    ['reaction', 'Audience reaction', 'audience-reaction spikes',
     'Dislikes, comments or unsubscribes well above what the video usually gets.',
     (A.reaction || []).map(e => attRow(e, {
       nums: e.kinds.map(k => `<div><b>${fmt(e.week[REACTION_KEYS[k]])}</b> ${k} this week ` +
         `<span class="muted">(usually ${rate(e.usual_week[REACTION_KEYS[k]])})</span></div>`).join(''),
     }))],
  ];
  const quiet = [];
  let body = '';
  for (const [key, title, quietLabel, rule, rows] of groups) {
    if (rows.length) body += attGroup(key, title, rule, rows);
    // Without two snapshots there is nothing to say about today yet.
    else if (key !== 'moving_today' || A.snapshot) quiet.push(quietLabel);
  }
  const topics = Object.keys(TOPIC_TITLES).map(n => topicTable(n, (A.topics || {})[n])).join('');
  if (topics) {
    body += `<div class="att-group"><div class="att-group-head"><h3>Rising topics</h3>
      <span class="att-rule">Searches, sites and other channels' videos sending at least 3× their usual views — what is heating up.</span></div>
      <div class="att-topics">${topics}</div></div>`;
  } else quiet.push('rising topics');
  const list = quiet.length > 1 ? quiet.slice(0, -1).join(', ') + ' or ' + quiet[quiet.length - 1] : quiet[0];
  el.innerHTML = head + health + body + (quiet.length ? `<p class="att-quiet">No ${list} this week.</p>` : '');
}

// "Show in table": filter the table down to the video and open its breakdown.
function focusVideo(id) {
  if (!((SUMMARY.windows || {})[currentWindow] || {})[id])
    document.querySelector('[data-window="all"]').click();
  const title = attTitle(id);
  F.text = title;
  document.getElementById('f-text').value = title;
  expanded = id;
  renderMetrics();
  render();
  const row = document.querySelector(`tr.row[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---- Sparkline with hover crosshair ----------------------------------------
let SPARK_PTS = [];
function renderSpark() {
  const svg = document.getElementById('spark');
  const peakEl = document.getElementById('spark-peak');
  if (!DAILY || !DAILY.series || DAILY.series.length < 2) { svg.classList.add('hidden'); peakEl.textContent = ''; return; }
  // Plot exactly the days the window's totals were summed over. Older
  // summary.json files have no ranges; fall back to the last N points.
  const range = (SUMMARY.ranges || {})[currentWindow];
  let s;
  if (range) {
    s = DAILY.series.filter(d => (!range.from || d.date >= range.from) && d.date <= range.to);
  } else {
    const days = currentWindow === 'all' ? DAILY.series.length
               : parseInt(currentWindow) || DAILY.series.length;
    s = DAILY.series.slice(-days);
  }
  if (s.length < 2) { svg.classList.add('hidden'); peakEl.textContent = ''; return; }
  const W = 1200, H = 120, padX = 6, padTop = 10, padBot = 16;
  const max = Math.max(...s.map(d => d.impressions || 0), 1);
  const step = s.length > 1 ? (W - padX * 2) / (s.length - 1) : 0;
  const yOf = v => H - padBot - ((v || 0) / max) * (H - padTop - padBot);
  SPARK_PTS = s.map((d, i) => ({ x: padX + i * step, y: yOf(d.impressions), d }));
  const line = SPARK_PTS.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${padX},${H - padBot} ${line} ${(padX + (s.length - 1) * step).toFixed(1)},${H - padBot}`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML =
    `<polygon points="${area}" fill="var(--accent-100)" opacity="0.5" />` +
    `<line x1="${padX}" y1="${H - padBot}" x2="${W - padX}" y2="${H - padBot}" stroke="var(--baseline)" stroke-width="1" />` +
    `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${line}" />` +
    `<circle id="sp-dot" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="opacity:0" />` +
    `<line id="sp-cross" y1="${padTop}" y2="${H - padBot}" stroke="var(--baseline)" stroke-width="1" style="opacity:0" />`;
  peakEl.textContent = `peak ${fmt(max)} · ${s.length} days`;
  svg.classList.remove('hidden');
}

function sparkHover(evt) {
  const svg = document.getElementById('spark');
  if (svg.classList.contains('hidden') || !SPARK_PTS.length) return;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const xv = ((evt.clientX - rect.left) / rect.width) * vb.width;
  let best = SPARK_PTS[0], bd = Infinity;
  for (const p of SPARK_PTS) { const dd = Math.abs(p.x - xv); if (dd < bd) { bd = dd; best = p; } }
  const dot = document.getElementById('sp-dot');
  const cross = document.getElementById('sp-cross');
  const tip = document.getElementById('sp-tip');
  if (dot) { dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y); dot.style.opacity = 1; }
  if (cross) { cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.style.opacity = 0.7; }
  const px = rect.left + (best.x / vb.width) * rect.width - document.getElementById('spark-wrap').getBoundingClientRect().left;
  const py = rect.top + (best.y / vb.height) * rect.height - document.getElementById('spark-wrap').getBoundingClientRect().top;
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
  tip.style.opacity = 1;
  tip.textContent = `${best.d.date}: ${fmt(best.d.impressions)} impressions`;
}
function sparkLeave() {
  ['sp-dot', 'sp-cross'].forEach(id => { const e = document.getElementById(id); if (e) e.style.opacity = 0; });
  document.getElementById('sp-tip').style.opacity = 0;
}

function trafficTable(sources) {
  const codes = Object.keys(sources || {});
  if (!codes.length) return null;
  const total = codes.reduce((s, n) => s + (sources[n].views || 0), 0) || 1;
  // Sort rows by views desc so the biggest sources lead.
  codes.sort((a, b) => (sources[b].views || 0) - (sources[a].views || 0));
  const body = codes.map(n => {
    const d = sources[n];
    const share = ((d.views || 0) / total) * 100;
    return `<tr>
      <td style="text-align:left">${esc(sourceLabel(n))}
        <span class="bar" style="width:${Math.max(share, 1)}%"></span></td>
      <td>${fmt(d.views)}</td>
      <td>${share.toFixed(1)}%</td>
      <td>${mins(d.watch_time_minutes)}</td>
      <td>${secs(d.avg_view_seconds)}</td>
      <td>${fmt(d.impressions)}</td>
      <td>${d.clicks === null || d.clicks === undefined ? '—' : fmt(d.clicks)}</td>
      <td class="${ctrClass(d.ctr)}">${pct(d.ctr)}</td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th style="text-align:left">Source</th><th>Views</th><th>Share</th>
      <th>Watch time</th><th>Avg view</th><th>Impressions</th><th>Clicks</th><th>CTR</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

function renderChannelTraffic() {
  const el = document.getElementById('channel-traffic');
  const tbl = trafficTable(slice(TRAFFIC, null));
  if (!tbl) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="card"><div class="card-pad">
    <h3 style="margin:0 0 10px;font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">
      Traffic sources · channel · ${esc(bucketLabel())}</h3>${tbl}</div></div>`;
}

// Age brackets and genders come back from the API in an arbitrary order; these
// give the "Age · gender" table a logical run from youngest to oldest (oldest
// at the bottom), male before female within a bracket.
const AGE_ORDER = ['AGE_13_17', 'AGE_18_24', 'AGE_25_34', 'AGE_35_44',
                   'AGE_45_54', 'AGE_55_64', 'AGE_65_'];
const GENDER_ORDER = ['MALE', 'FEMALE', 'USER_SPECIFIED', 'GENDER_OTHER', 'UNKNOWN'];
const rank = (arr, k) => { const i = arr.indexOf(k); return i < 0 ? 99 : i; };
function demoSort(a, b) {
  const [aAge, aG] = String(a[0]).split('/');
  const [bAge, bG] = String(b[0]).split('/');
  return rank(AGE_ORDER, aAge) - rank(AGE_ORDER, bAge)
      || rank(GENDER_ORDER, aG) - rank(GENDER_ORDER, bG);
}

// keyFn maps each raw key to already-safe display HTML (a decoded label).
// sortFn orders the rows; it defaults to views-descending so the most impactful
// entries lead, and callers pass their own comparator when a different order
// (e.g. by age) reads better.
function countTable(obj, label, cap, keyFn, sortFn) {
  const entries = Object.entries(obj || {});
  if (!entries.length) return null;
  const total = entries.reduce((s, [, v]) => s + v, 0) || 1;
  entries.sort(sortFn || ((a, b) => b[1] - a[1]));
  const kf = keyFn || (k => esc(k));
  const rows = entries.slice(0, cap || 12).map(([k, v]) => `<tr>
      <td style="text-align:left">${kf(k)}</td>
      <td>${fmt(v)}</td>
      <td>${((v / total) * 100).toFixed(1)}%</td>
    </tr>`).join('');
  return `<table class="mini">
    <colgroup><col><col class="c-val"><col class="c-share"></colgroup>
    <thead><tr>
      <th style="text-align:left">${esc(label)}</th><th>Views</th><th>Share</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

// Search terms & referrers, compacted: one row per (source, detail) pair with
// the source shown once per group, instead of a header-plus-rows block per
// source. Removes the empty section lines and keeps the whole panel short.
function searchTermsTable(det) {
  const srcs = Object.keys(det || {});
  if (!srcs.length) return null;
  const srcTotal = s => Object.values(det[s]).reduce((a, b) => a + b, 0);
  srcs.sort((a, b) => srcTotal(b) - srcTotal(a));
  let body = '';
  for (const s of srcs) {
    const items = Object.entries(det[s]).sort((a, b) => b[1] - a[1]);
    items.forEach(([detail, v], i) => {
      body += `<tr>
        ${i === 0 ? `<td class="grp" rowspan="${items.length}">${esc(sourceLabel(s))}</td>` : ''}
        <td style="text-align:left">${detailCell(detail)}</td>
        <td>${fmt(v)}</td>
      </tr>`;
    });
  }
  return `<table class="mini">
    <colgroup><col class="c-src"><col><col class="c-val"></colgroup>
    <thead><tr><th style="text-align:left">Source</th>
      <th style="text-align:left">Search term / referrer</th><th>Views</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

function pending(what) {
  return `<div class="empty">No ${esc(what)} data for ${esc(bucketLabel())} yet.</div>`;
}

function detailPanels(id) {
  const t = trafficTable(slice(TRAFFIC, id));

  const det = slice(TDETAIL, id) || {};
  const detHtml = searchTermsTable(det);

  const dev = slice(DEVICES, id);
  const devHtml = dev && (Object.keys(dev.device || {}).length || Object.keys(dev.os || {}).length)
    ? (countTable(dev.device, 'Device', 8, deviceLabel) || '')
      + (countTable(dev.os, 'Operating system', 8, osLabel) || '')
    : null;

  const demo = slice(DEMOGRAPHICS, id);
  const demoHtml = demo && Object.keys(demo).length
    ? countTable(demo, 'Age · gender', 20, demoLabel, demoSort)
    : null;

  // Traffic sources carries the most columns (through to Clicks and CTR), so it
  // spans the full width on its own row; the other three share the grid below.
  return `<div class="panels">
    <div class="panel-box" style="grid-column:1/-1"><h3>Traffic sources · ${esc(bucketLabel())}</h3>
      ${t || pending('traffic source')}</div>
    <div class="panel-box"><h3>Search terms &amp; referrers</h3>
      ${detHtml || pending('traffic detail')}</div>
    <div class="panel-box"><h3>Device &amp; OS</h3>
      ${devHtml || pending('device')}</div>
    <div class="panel-box"><h3>Age &amp; gender</h3>
      ${demoHtml || pending('demographic')}</div>
  </div>`;
}

function ctrClass(v) {
  if (v === null || v === undefined) return '';
  if (v >= 6) return 'good';
  if (v >= 3) return 'warn';
  return 'bad';
}

function render() {
  const rows = currentRows();
  document.getElementById('f-count').textContent =
    `${rows.length} of ${allRows().length} videos`;

  document.querySelectorAll('[data-sort]').forEach(th => {
    const on = th.dataset.sort === sortKey;
    th.classList.toggle('sorted', on);
    th.innerHTML = th.textContent.replace(/ [▲▼]$/, '') + (on ? ` <span class="arrow">${sortDir < 0 ? '▼' : '▲'}</span>` : '');
  });

  const html = rows.map(r => {
    const open = expanded === r.id;
    const sub = [r.durationSec !== null ? secs(r.durationSec) : null, r.id]
      .filter(Boolean).join(' · ');
    return `
    <tr class="row ${open ? 'open' : ''}" data-id="${esc(r.id)}">
      <td>
        <div class="title-cell">
          ${r.thumb ? `<img src="${esc(r.thumb)}" alt="" loading="lazy">` : ''}
          <div>
            <div><span class="caret">${open ? '▼' : '▶'}</span><span class="t">${esc(r.title || r.id)}</span></div>
            <div class="sub">${esc(sub)}</div>
          </div>
        </div>
      </td>
      <td>${r.published ? new Date(r.published).toLocaleDateString() : '—'}</td>
      <td>${fmt(r.impressions)}</td>
      <td class="${ctrClass(r.ctr)}">${pct(r.ctr)}</td>
      <td>${fmt(r.views)}</td>
      <td>${pct(r.avg_view_percentage)}</td>
      <td>${mins(r.watch_time_minutes)}</td>
      <td>${r.wt_share === null || r.wt_share === undefined ? '—'
            : `${r.wt_share.toFixed(1)}%<span class="bar wt" style="width:${Math.max(r.wt_share, 1)}%"></span>`}</td>
      <td>${fmt(r.subscribers_gained)}</td>
      <td>${pct(r.engagement)}</td>
    </tr>` + (open
      ? `<tr><td class="detail" colspan="${COLSPAN}">${detailPanels(r.id)}</td></tr>`
      : '');
  }).join('');

  document.getElementById('rows').innerHTML = html ||
    `<tr><td colspan="${COLSPAN}" style="color:var(--muted);padding:20px;">` +
    `No videos match these filters.</td></tr>`;
}

// ---- Published-date quick presets ------------------------------------------
// The two date pickers set an exact published range; these buttons fill them in
// for the common "last N days" cases so you don't have to pick dates by hand.
// "Any" clears the range. Note this filters *which videos* are listed by their
// upload date — it is separate from the time-window buttons above, which choose
// the period the metrics themselves are measured over.
const ymd = d => d.toISOString().slice(0, 10);
function setPubPreset(val) {
  document.querySelectorAll('[data-pub]').forEach(x =>
    x.classList.toggle('active', x.dataset.pub === val));
  if (val === 'all') {
    F.from = ''; F.to = '';
  } else {
    const from = new Date();
    from.setUTCDate(from.getUTCDate() - parseInt(val, 10));
    F.from = ymd(from); F.to = '';
  }
  document.getElementById('f-from').value = F.from;
  document.getElementById('f-to').value = F.to;
  renderMetrics(); render();
}
// A hand-edited range no longer matches a preset, so light "Any" only when the
// range is empty and drop the highlight from every button otherwise.
function syncPubPreset() {
  document.querySelectorAll('[data-pub]').forEach(x =>
    x.classList.toggle('active', x.dataset.pub === 'all' && !F.from && !F.to));
}

function refreshAll() {
  populateSources();
  renderMetrics();
  renderSpark();
  renderChannelTraffic();
  render();
}

document.querySelectorAll('[data-window]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-window]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentWindow = b.dataset.window;
    refreshAll();
  });
});

const attEl = document.getElementById('attention');
attEl.addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) {
    const k = more.dataset.more;
    if (attOpen.has(k)) attOpen.delete(k); else attOpen.add(k);
    renderAttention();
    return;
  }
  const focus = e.target.closest('[data-focus]');
  if (focus) focusVideo(focus.dataset.focus);
});
attEl.addEventListener('mousemove', attSparkHover);
attEl.addEventListener('mouseleave', () => { document.getElementById('att-tip').style.opacity = 0; });

// Clicking a row opens its breakdown; clicking it again closes it.
document.getElementById('rows').addEventListener('click', e => {
  const tr = e.target.closest('tr.row');
  if (!tr) return;
  expanded = expanded === tr.dataset.id ? null : tr.dataset.id;
  render();
});

// Sparkline hover
(() => {
  const svg = document.getElementById('spark');
  svg.addEventListener('mousemove', sparkHover);
  svg.addEventListener('mouseleave', sparkLeave);
})();

const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
on('f-text', 'input', e => { F.text = e.target.value; renderMetrics(); render(); });
on('f-from', 'change', e => { F.from = e.target.value; syncPubPreset(); renderMetrics(); render(); });
on('f-to', 'change', e => { F.to = e.target.value; syncPubPreset(); renderMetrics(); render(); });
document.querySelectorAll('[data-pub]').forEach(b =>
  b.addEventListener('click', () => setPubPreset(b.dataset.pub)));
on('f-format', 'change', e => { F.format = e.target.value; renderMetrics(); render(); });
on('f-source', 'change', e => { F.source = e.target.value; renderMetrics(); render(); });
on('f-minviews', 'input', e => {
  F.minViews = Number(e.target.value) || 0; renderMetrics(); render();
});
on('f-reset', 'click', () => {
  F.text = ''; F.from = ''; F.to = ''; F.format = 'all'; F.source = 'all'; F.minViews = 0;
  ['f-text', 'f-from', 'f-to', 'f-minviews'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('f-format').value = 'all';
  document.getElementById('f-source').value = 'all';
  syncPubPreset();
  expanded = null;
  refreshAll();
});

init();
</script>
</body>
</html>
