name: Discover intake

# What you ask for on the dashboard, applied within minutes instead of at the
# next daily run: a Dismiss, or a game's Keyword Planner number (Set under
# Search volumes). discover.py --offline reads the issue, stores it in
# data/discover.json, closes the issue and rebuilds Discover from the saved
# pulls. It spends no Google Trends searches and touches no YouTube data.
on:
  issues:
    types: [opened]

concurrency:
  # The collector's queue: the two never commit at once. A run waiting here
  # can replace a waiting daily run, which is harmless: the next daily run
  # downloads whatever was missed (reports stay available for 60 days).
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: startsWith(github.event.issue.title, 'Dismiss:') || startsWith(github.event.issue.title, 'Searches a month:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply it to Discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discover.py --offline

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discover.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "data: Discover, from issue #${{ github.event.issue.number }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
