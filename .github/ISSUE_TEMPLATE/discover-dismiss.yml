name: Dismiss a discovery
description: Hide a search from the dashboard's Discover section. The dashboard fills this in.
title: "Dismiss: "
labels: ["discover"]
body:
  - type: markdown
    attributes:
      value: |
        Within a few minutes it is hidden from Discover, recorded under `dismissed` in
        `data/discover.json`, and this issue is closed. To show it again, remove it there.
  - type: input
    id: item
    attributes:
      label: What to hide
      description: The search, exactly as Discover shows it.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Hide it only on this game's card, "new games" for the radar, "areas" for a theme (the dashboard fills it in). Empty hides it everywhere.
